[package]
name = "clash-of-rust"
version = "0.4.1"
edition = "2024"
description = "A native Rust desktop client for mihomo"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "image-without-codecs"] }
iced_graphics = { version = "0.14", default-features = false }
cosmic-text = { version = "0.15", default-features = false, features = ["std"] }
unicode-script = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "net", "io-util", "macros"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
sha2 = "0.10"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
