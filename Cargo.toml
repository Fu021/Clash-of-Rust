[workspace]
members = ["crates/client-core", "apps/desktop"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.5.11-dev.1"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "image-without-codecs", "advanced"] }
iced_graphics = { version = "0.14", default-features = false }
cosmic-text = { version = "0.15", default-features = false, features = ["std"] }
unicode-script = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks", "cookies"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "fs", "macros"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
sha2 = "0.10"
regex = "1"
roxmltree = "0.20"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }


[profile.dev]
# Keep line/function information while reducing development link/debug overhead.
debug = 1

[profile.release]
# Favor repeatable desktop builds over expensive cross-crate LTO.
opt-level = 3
lto = false
codegen-units = 16
incremental = true
strip = true
