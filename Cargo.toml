[workspace]
members = ["crates/client-core", "crates/client-runtime", "apps/cli", "crates/client-ui", "crates/mobile-ffi", "apps/desktop", "apps/desktop-ui", "crates/desktop-shell", "crates/desktop-protocol", "apps/android/native"]
default-members = ["apps/desktop", "apps/desktop-ui"]
resolver = "3"

[workspace.package]
version = "0.6.3"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks", "cookies"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "fs", "macros"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-path", "unstable-winit-030"] }
slint-build = "=1.18.1"
sha2 = "0.10"
regex = "1"
roxmltree = "0.20"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[profile.dev]
# Keep line/function information while reducing development link/debug overhead.
debug = 1

[profile.release]
# Keep resident code compact, including shared runtime and rendering dependencies.
opt-level = "s"
lto = false
codegen-units = 16
incremental = true
strip = true

# Desktop state adapters and generated UI code are dominated by instruction
# pages. Use one codegen unit to avoid duplicating these adapters across units.
[profile.release.package.clash-of-rust]
opt-level = "s"
codegen-units = 1

[profile.release.package.clash-desktop-ui]
opt-level = "s"
codegen-units = 1

[profile.release.package.clash-client-ui]
opt-level = "s"
codegen-units = 1

[profile.release.package.clash-desktop-protocol]
opt-level = "s"
codegen-units = 1

[profile.release.package.clash-desktop-shell]
opt-level = "s"
codegen-units = 1
