name: Memory Benchmark
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '需要测量的分支、标签或提交 SHA；留空测当前所选分支'
        required: false
        type: string
      profile:
        description: '构建模式；比较不同结果时保持一致'
        type: choice
        options: [release, dev]
        default: release
      workload:
        description: '测试强度；light 为低强度，stress 为原压力测试'
        type: choice
        options: [light, stress]
        default: light
      rows:
        description: '可选：覆盖 API 数据量；留空使用 light 1000 / stress 50000'
        type: string
        required: false
      repetitions:
        description: '每项 API 测试的独立进程重复次数'
        type: string
        default: '3'
      sample_seconds:
        description: '每个 GUI 场景的采样秒数'
        type: string
        default: '10'
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  ZSTD_CLEVEL: '1'
permissions:
  contents: read
jobs:
  benchmark:
    name: Linux x64 memory benchmark
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COR_USE_BOOTSTRAP_TAILNET: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - name: Resolve selected revision
        id: source
        shell: python
        env:
          SOURCE_REF: ${{ inputs.ref || github.ref }}
        run: |
          import os, subprocess
          wanted = os.environ['SOURCE_REF']
          for revision in (wanted, 'refs/remotes/origin/' + wanted):
              result = subprocess.run(['git', 'rev-parse', '--verify', '--end-of-options', revision + '^{commit}'], capture_output=True, text=True)
              if result.returncode == 0:
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write('commit=' + result.stdout.strip() + '\n')
                  break
          else:
              raise ValueError('Selected branch, tag or commit was not found in this repository')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - name: Remember original macOS DNS before cache login
        if: runner.os == 'macOS'
        id: original_dns
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/action_cache.py', 'network-save'], check=True)
      - name: Connect to private cache network
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        timeout-minutes: ${{ runner.os == 'macOS' && 10 || 3 }}
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ env.COR_TAILSCALE }}
          use-cache: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Restore macOS DNS after cache login
        if: always() && runner.os == 'macOS' && steps.original_dns.outcome == 'success'
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/action_cache.py', 'network-restore'], check=True)
      - name: Preserve host routing after private cache login
        if: steps.tailnet.outcome == 'success'
        shell: python
        run: |
          import os, shutil, subprocess
          # The official action supplies --accept-routes itself. Passing it a
          # second time is rejected; turn it off after login, before any tests.
          command = [shutil.which('tailscale') or 'tailscale', 'set', '--accept-routes=false', '--accept-dns=false']
          if os.name != 'nt': command = ['sudo', '-n', *command]
          subprocess.run(command, check=True)
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.COR_RUST }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        timeout-minutes: 5
        continue-on-error: true
        id: rust_github
        with:
          workspaces: source -> target
          prefix-key: memory-main-v1-${{ inputs.profile }}
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' && steps.source.outputs.commit == github.sha }}
      - name: Discard interrupted GitHub compiler restore
        if: steps.rust_github.outcome == 'failure'
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from action_cache import discard_restore
          discard_restore({'kind': 'rust', 'source': 'source'})
      - name: Identify restored benchmark compiler objects
        id: benchmark_cache
        if: github.ref != 'refs/heads/main' && steps.source.outputs.commit == github.sha && steps.rust_github.outcome == 'success'
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, 'scripts')
          from action_cache import github_restored
          restored = github_restored({'kind': 'rust', 'source': 'source', 'github_hit': 'false'})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(restored).lower() + '\n')
      - name: Restore benchmark branch compiler changes
        id: branch_cache
        if: steps.benchmark_cache.outputs.ready == 'true'
        uses: ./.github/actions/branch-cache-restore
        timeout-minutes: 5
        with:
          family: memory-${{ inputs.profile }}
          source: source
      - name: Install benchmark dependencies
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from linux_apt import OPTIONS, privileged, install
          privileged([*OPTIONS, 'update'], 300)
          install(['libglib2.0-dev', 'libfontconfig1-dev', 'libfreetype6-dev', 'libxkbcommon-dev', 'libwayland-dev', 'libx11-dev', 'libx11-xcb-dev', 'libxkbcommon-x11-0', 'libxcursor1', 'libxrandr2', 'libxi6', 'libxinerama1', 'libegl1', 'gsettings-desktop-schemas', 'dbus', 'xvfb', 'xauth', 'xdotool', 'python3-gi'])
      - name: Enqueue verified original downloads before benchmarking
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          checkpoint: 'true'
      - name: Benchmark the selected source
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_PROFILE: ${{ inputs.profile }}
          BENCH_WORKLOAD: ${{ inputs.workload }}
          BENCH_ROWS: ${{ inputs.rows }}
          BENCH_REPETITIONS: ${{ inputs.repetitions }}
          SAMPLE_SECONDS: ${{ inputs.sample_seconds }}
        run: |
          import os, subprocess, sys
          # The disposable renderer can be the only X client. Keep Xvfb alive
          # across its exit rather than resetting the server during reopening.
          command = ['dbus-run-session', '--', 'xvfb-run', '-a', '--server-args=-screen 0 1280x900x24 -noreset', sys.executable, 'scripts/run-memory-benchmark.py', '--source', 'source', '--profile', os.environ['BUILD_PROFILE'], '--workload', os.environ['BENCH_WORKLOAD'], '--repetitions', os.environ['BENCH_REPETITIONS'], '--seconds', os.environ['SAMPLE_SECONDS'], '--output', 'dist/memory']
          if os.environ['BENCH_ROWS'].strip():
              command += ['--rows', os.environ['BENCH_ROWS']]
          subprocess.run(command, check=True)
      - name: Save benchmark branch compiler changes
        if: steps.branch_cache.outputs.ready == 'true' && steps.branch_cache.outputs.hit != 'true'
        uses: ./.github/actions/branch-cache-save
        continue-on-error: true
        timeout-minutes: 5
        with:
          source: source
          key: ${{ steps.branch_cache.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: memory-results-${{ github.run_id }}
          path: dist/memory
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  cache_budget:
    name: Actions cache budget
    needs: [benchmark]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    concurrency:
      group: actions-cache-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Protect main caches and limit branch caches
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/workflow_storage.py
