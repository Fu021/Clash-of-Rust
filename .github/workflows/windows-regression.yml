name: Windows version regression investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: Published versions / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            python: '3.11'
          - os: windows-11-arm
            arch: arm64
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Compare actual published applications without rebuilding
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/test-windows-upgrade.py'], check=True)
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-version-regression-${{ matrix.arch }}
          path: dist/windows-upgrade
          if-no-files-found: warn
          retention-days: 7
