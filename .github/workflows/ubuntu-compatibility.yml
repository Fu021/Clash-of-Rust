name: Ubuntu Compatibility
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run for the selected branch commit
        required: true
        type: string
env:
  BUILD_INPUTS_DIR: dependency-snapshot
  PYTHONDONTWRITEBYTECODE: '1'
  COR_CI_EXTENDED_TESTS: 'false'
  COR_CI_LINUX_USER_TESTS: 'false'
permissions:
  actions: read
  contents: read
concurrency:
  group: ubuntu-compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve verified Ubuntu inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve the verified CI source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: python3 scripts/compatibility.py resolve --suite ubuntu --run-id "$SOURCE_RUN"
  ubuntu:
    name: Ubuntu 20.04-${{ matrix.arch }} installed proxy and TUN
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
          run-id: ${{ needs.resolve.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Apply frozen inputs
        run: python3 scripts/build_inputs.py apply
      - name: Connect to private Linux download cache
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        timeout-minutes: 3
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ env.COR_TAILSCALE }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Preserve host routing
        if: steps.tailnet.outcome == 'success'
        run: sudo -n tailscale set --accept-routes=false --accept-dns=false
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - name: Configure VM originals before prepared-image lookup
        uses: ./.github/actions/linux-download-cache
        timeout-minutes: 15
        continue-on-error: true
        with:
          vm: 'true'
          download-originals: 'false'
      - name: Install virtual machine tools
        shell: python
        env:
          QEMU_PACKAGES: ${{ matrix.qemu }}
        run: |
          import os, pathlib, subprocess
          import sys
          sys.path.insert(0, 'scripts')
          from linux_apt import OPTIONS, privileged, install
          os.environ['COR_LINUX_APT_CACHE'] = os.environ['COR_HOST_APT_CACHE']
          privileged([*OPTIONS, 'update'], 300)
          install([*os.environ['QEMU_PACKAGES'].split(), 'qemu-utils', 'cloud-image-utils'])
          if pathlib.Path('/dev/kvm').exists():
              subprocess.run(['sudo', 'chmod', 'a+rw', '/dev/kvm'], check=True)
          else:
              print('KVM is unavailable; keeping TCG software emulation.')
      - name: Enqueue verified VM originals before boot
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          checkpoint: 'true'
      - name: Restore Ubuntu 20.04 and verify the selected CI candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
          SOURCE_RUN: ${{ needs.resolve.outputs.ci_run_id }}
        run: python3 scripts/linux_ci.py vm --package-run-id "$SOURCE_RUN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && hashFiles('target/linux-report/**') != ''
        with:
          name: linux-package-report-ubuntu20-${{ matrix.arch }}
          path: target/linux-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-ubuntu-${{ matrix.arch }}
  record:
    name: Record Ubuntu compatibility
    needs: [resolve, ubuntu]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Bind passing compatibility checks to the CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.resolve.outputs.ci_run_id }}
        run: python3 scripts/compatibility.py record --suite ubuntu --run-id "$SOURCE_RUN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu-compatibility-attempt-${{ github.run_attempt }}
          path: target/compatibility
          if-no-files-found: error
          retention-days: 3
