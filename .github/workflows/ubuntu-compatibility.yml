name: Ubuntu Compatibility
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run for the selected branch commit
        required: true
        type: string
      update_from_ci:
        description: Previous successful CI run for a published update test
        required: false
        type: string
      update_release:
        description: Published release tag to install during the update test
        required: false
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: ubuntu-compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Linux
    uses: ./.github/workflows/linux-compatibility.yml
    with:
      suite: ubuntu
      run_id: ${{ inputs.run_id }}
      update_from_ci: ${{ inputs.update_from_ci }}
      update_release: ${{ inputs.update_release }}
