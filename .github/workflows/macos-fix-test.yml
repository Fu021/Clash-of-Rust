name: macOS Fix Validation (Temporary)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Rust CI for this exact commit; empty waits for CI
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'codex/fix-macos-dns-update' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      commit: ${{ steps.ci.outputs.commit }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Wait for exact successful CI source
        id: ci
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_CI_RUN: ${{ inputs.ci_run_id }}
        run: |
          import os, subprocess, sys
          command=[sys.executable,'scripts/test-claude-protection.py','resolve','--head',os.environ['TEST_HEAD']]
          if os.environ.get('TEST_CI_RUN'): command += ['--ci-run-id',os.environ['TEST_CI_RUN']]
          subprocess.run(command,check=True)
  native:
    needs: resolve
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, arch: x64}
          - {os: macos-latest, arch: arm64}
    name: macos-fixes-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
      - name: Fetch verified prebuilt CI binaries
        shell: python
        env:
          BUILD_RUN: ${{ needs.resolve.outputs.ci_run_id }}
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable,'scripts/workflow_artifacts.py','fetch','--run-id',os.environ['BUILD_RUN'],'--system','macos','--arch','${{ matrix.arch }}','--output','target/macos-fix-build'],check=True)
      - name: Real launchd and system DNS tests
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable,'scripts/test-macos-fixes.py','--build','target/macos-fix-build'],check=True)
      - name: Collect diagnostics
        if: always()
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable,'scripts/macos_ci.py','diagnostics','--arch','${{ matrix.arch }}'],check=True)
      - name: Retain measured outcomes and native logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-fixes-${{ matrix.arch }}
          path: target/macos-report
          if-no-files-found: error
          retention-days: 7
