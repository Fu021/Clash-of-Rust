name: Claude Protection Validation (Temporary)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Rust CI for this exact commit; empty waits for CI
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: claude-protection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'codex/claude-protection' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      commit: ${{ steps.ci.outputs.commit }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate browser collector syntax
        shell: python
        run: |
          import subprocess
          subprocess.run(['node','--check','resources/claude-check/browser.js'],check=True)
      - name: Wait for and verify immutable CI source
        id: ci
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          command=[sys.executable,'scripts/test-claude-protection.py','resolve','--head','${{ github.event.pull_request.head.sha || github.sha }}']
          if '${{ inputs.ci_run_id }}': command += ['--ci-run-id','${{ inputs.ci_run_id }}']
          subprocess.run(command,check=True)
  native:
    needs: resolve
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, system: linux, arch: x64, target: x86_64-unknown-linux-gnu, python: '3.11'}
          - {os: ubuntu-22.04-arm, system: linux, arch: arm64, target: aarch64-unknown-linux-gnu, python: '3.11'}
          - {os: windows-latest, system: windows, arch: x64, target: x86_64-pc-windows-msvc, python: '3.11'}
          - {os: windows-11-arm, system: windows, arch: arm64, target: aarch64-pc-windows-msvc, python: '3.13'}
          - {os: macos-15-intel, system: macos, arch: x64, target: x86_64-apple-darwin, python: '3.11'}
          - {os: macos-latest, system: macos, arch: arm64, target: aarch64-apple-darwin, python: '3.11'}
    name: claude-${{ matrix.system }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: native-release-${{ matrix.os }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Linux native test and renderer dependencies
        if: runner.os == 'Linux'
        shell: python
        run: |
          import subprocess
          subprocess.run(['sudo','apt-get','update'],check=True)
          subprocess.run(['sudo','apt-get','install','-y','libglib2.0-dev','libxkbcommon-dev','libwayland-dev','libx11-dev','libx11-xcb-dev','gsettings-desktop-schemas','dbus','xvfb','xauth','libxkbcommon-x11-0','libxcursor1','libxrandr2','libxi6','libxinerama1','libegl1','iproute2','util-linux','libcap2-bin','systemd','zenity','xdotool','imagemagick','fonts-wqy-microhei'],check=True)
      - name: Fetch verified CI build
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.run([sys.executable,'scripts/test-claude-protection.py','clean'],check=True)
          sys.path.insert(0,'scripts')
          from pathlib import Path
          from build_support import ROOT
          import workflow_artifacts
          release=workflow_artifacts.release_module()
          repo=release.repository()
          client=release.GitHub(repo,release.credential(repo))
          workflow_artifacts.fetch_build(client,int('${{ needs.resolve.outputs.ci_run_id }}'),'${{ matrix.system }}','${{ matrix.arch }}',Path('target/claude-build'),'${{ needs.resolve.outputs.commit }}')
      - name: Native protection, restore and enforcement tests
        shell: python
        run: |
          import subprocess,sys
          command=[sys.executable,'scripts/test-claude-protection.py','check','--build','target/claude-build','--output','target/claude-validation']
          if '${{ matrix.system }}'=='linux':
              command=['dbus-run-session','--','xvfb-run','-a','--server-args=-screen 0 1800x1200x24',*command]
          subprocess.run(command,check=True)
      - name: Render measured reports and activation warning
        shell: python
        run: |
          import subprocess,sys
          command=[sys.executable,'scripts/ui-screenshots.py','render','--source','.','--ci-run-id','${{ needs.resolve.outputs.ci_run_id }}','--system','${{ matrix.system }}','--arch','${{ matrix.arch }}','--output','target/claude-validation/screenshots','--sizes','normal','--report-file','target/claude-validation/results.json','--scenes','claude-validation-before','claude-validation-protected','claude-validation-blocked','claude-validation-blocked-details','claude-validation-restored','claude-validation-warning']
          if '${{ matrix.system }}'=='linux':
              command=['dbus-run-session','--','xvfb-run','-a','--server-args=-screen 0 1800x1200x24',*command]
          subprocess.run(command,check=True)
      - name: Retain measurements and native UI pixels
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-validation-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            target/claude-validation
            target/macos-report
          if-no-files-found: warn
          retention-days: 7
      - name: Exclude scratch payloads and measurements from the Rust cache
        if: always()
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'scripts/test-claude-protection.py','clean'],check=True)
