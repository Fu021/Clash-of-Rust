name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: Resolve updated Cargo/Go lockfiles for a subsequent reviewed commit
        type: boolean
        default: false
      extended_tests:
        description: Run optional source, UI and platform regression suites
        type: boolean
        default: false
      proxy_benchmark:
        description: Compare desktop loopback proxy throughput and local node latency
        type: boolean
        default: false
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  BUILD_INPUTS_DIR: dependency-snapshot
  RUST_BACKTRACE: '1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inputs:
    name: Resolve build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COR_USE_BOOTSTRAP_TAILNET: 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      go: ${{ steps.go.outputs.go-version }}
      java: ${{ steps.versions.outputs.java }}
      resources: ${{ steps.resolve.outputs.resources }}
      tailscale: ${{ steps.resolve.outputs.tailscale }}
      nsis: ${{ steps.resolve.outputs.nsis }}
      extended_tests: ${{ steps.test_policy.outputs.extended_tests }}
      android_routing_tests: ${{ steps.test_policy.outputs.android_routing_tests }}
      linux_user_tests: ${{ steps.test_policy.outputs.linux_user_tests }}
      desktop_ui_tests: ${{ steps.test_policy.outputs.desktop_ui_tests }}
      proxy_benchmark: ${{ steps.test_policy.outputs.proxy_benchmark }}
      update_tests: ${{ steps.test_policy.outputs.update_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select optional regression tests
        id: test_policy
        env:
          COR_CI_EXTENDED_TESTS: ${{ inputs.extended_tests && 'true' || 'false' }}
          COR_CI_PROXY_BENCHMARK: ${{ inputs.proxy_benchmark && 'true' || 'false' }}
        run: python3 scripts/ci_test_policy.py
      - name: Load approved tool versions
        id: versions
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - name: Validate common build and package logic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          node --check .github/actions/upstream-cache/index.cjs
          python3 scripts/test-build-tools.py --buffer
          python3 scripts/test-workflow-artifacts.py --buffer
      - name: Connect for original download fallback and URL imports
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        timeout-minutes: 3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ env.COR_TAILSCALE }}
          use-cache: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Keep runner routing unchanged
        if: steps.tailnet.outcome == 'success'
        run: sudo -n tailscale set --accept-routes=false --accept-dns=false
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: go
        with:
          go-version: ${{ env.COR_GO }}
          cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        if: inputs.refresh_dependencies
        with:
          toolchain: ${{ env.COR_RUST }}
      - name: Resolve updated source lockfiles
        if: inputs.refresh_dependencies
        run: python3 scripts/build_inputs.py refresh --directory target/dependency-updates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.refresh_dependencies
        with:
          name: dependency-updates
          path: target/dependency-updates
          retention-days: 3
          if-no-files-found: error
      - name: Freeze approved source dependencies without updating versions
        if: ${{ !inputs.refresh_dependencies }}
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          COR_PREPARED_VM_INPUTS: 'true'
        run: python3 scripts/build_inputs.py resolve
      - name: Prepare shared Android source downloads
        if: ${{ !inputs.refresh_dependencies }}
        run: python3 scripts/build_inputs.py share-go --directory target/shared-go
      - name: Enqueue verified source downloads before matrix builds
        if: ${{ !inputs.refresh_dependencies }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          checkpoint: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !inputs.refresh_dependencies }}
        with:
          name: android-shared-dependencies
          path: target/shared-go
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !inputs.refresh_dependencies }}
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
          retention-days: 3
          if-no-files-found: error
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  android:
    if: ${{ !inputs.refresh_dependencies }}
    name: android-${{ matrix.arch }}
    needs: inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
          - arch: armv7
            target: armv7-linux-androideabi
          - arch: x64
            target: x86_64-linux-android
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ANDROID_CI_TEST: '1'
      GOCACHE: ${{ github.workspace }}/target/go-build
      COR_CI_EXTENDED_TESTS: ${{ needs.inputs.outputs.extended_tests }}
      COR_CI_ANDROID_ROUTING_TESTS: ${{ needs.inputs.outputs.android_routing_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Load approved tool versions
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'versions'], check=True)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
      - name: Apply the resolved source dependency snapshot
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'apply'], check=True)
      - name: Connect to private cache network
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        timeout-minutes: 3
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.inputs.outputs.tailscale }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Preserve host routing after private cache login
        if: steps.tailnet.outcome == 'success'
        shell: python
        run: |
          import os, shutil, subprocess
          # The official action supplies --accept-routes itself. Passing it a
          # second time is rejected; turn it off after login, before any tests.
          command = [shutil.which('tailscale') or 'tailscale', 'set', '--accept-routes=false', '--accept-dns=false']
          if os.name != 'nt': command = ['sudo', '-n', *command]
          subprocess.run(command, check=True)
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.COR_RUST }}
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        timeout-minutes: 5
        continue-on-error: true
        id: rust_github
        with:
          prefix-key: android-v2-${{ matrix.arch }}
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Discard interrupted GitHub compiler restore
        if: steps.rust_github.outcome == 'failure'
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from action_cache import discard_restore
          discard_restore({'kind': 'rust', 'source': '.'})
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-shared-dependencies
          path: target/shared-go
      - name: Restore verified shared source downloads
        run: python3 scripts/build_inputs.py restore-go --directory target/shared-go
      - name: Prepare verified Gradle with private original fallback
        run: python3 scripts/build_inputs.py prepare-gradle --directory '${{ runner.temp }}/cor-gradle'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: ${{ env.COR_JAVA }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: go
        with:
          go-version: ${{ needs.inputs.outputs.go }}
          cache: false
      - name: Verify approved Android build tools before compiling
        run: python3 scripts/build_inputs.py check-tools --tools go java gradle
      - name: Load stable development signature when configured
        shell: python
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE }}
          DEV_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
        run: |
          import base64, os, pathlib
          if os.environ.get('DEV_KEYSTORE') and os.environ.get('DEV_PASSWORD'):
              password=os.environ['DEV_PASSWORD']
              if '\n' in password or '\r' in password: raise ValueError('Invalid signing password')
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-development.p12'
              path.write_bytes(base64.b64decode(os.environ['DEV_KEYSTORE'],validate=True))
              path.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write('ANDROID_KEYSTORE_PATH='+str(path)+'\n')
                  out.write('ANDROID_KEY_ALIAS=cor-android-dev\n')
                  out.write('ANDROID_KEYSTORE_PASSWORD='+password+'\n')
                  out.write('ANDROID_KEY_PASSWORD='+password+'\n')
          else:
              print('Using an ephemeral CI test signature; APKs from different CI runs cannot replace one another.')
      - name: Prepare Android toolchain
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from android import prepare_sdk
          prepare_sdk()
      - name: Enqueue verified Android tools before compilation
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          checkpoint: 'true'
      - name: Compile Android application and embedded core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android.py build --arch ${{ matrix.arch }}
      - name: Start Android test device
        if: matrix.arch == 'x64'
        run: |
          sudo chmod a+rw /dev/kvm
          python3 scripts/android.py emulator --arch x64
      - name: Export Android compilation for candidate validation
        run: python3 scripts/android.py export --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: android_build
        with:
          name: build-android-${{ matrix.arch }}
          path: |
            dist/android-build/build.tar.gz
            dist/android-build/build.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Package and validate the Android candidate
        shell: python
        env:
          BUILD_ARTIFACT_ID: ${{ steps.android_build.outputs.artifact-id }}
          BUILD_ARTIFACT_DIGEST: ${{ steps.android_build.outputs.artifact-digest }}
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from workflow_artifacts import stage_local_build, commit
          stage_local_build(pathlib.Path('dist/android-build/build.tar.gz'), pathlib.Path('ci-build'),
              'android', '${{ matrix.arch }}', commit(),
              int(os.environ['BUILD_ARTIFACT_ID']), os.environ['BUILD_ARTIFACT_DIGEST'])
          subprocess.run([sys.executable, 'scripts/android.py', 'package', '--arch', '${{ matrix.arch }}',
              '--run-id', '${{ github.run_id }}', '--check', '--build', 'ci-build'], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-android-${{ matrix.arch }}
          path: |
            dist/*.apk
            dist/*.sha256
            dist/package-receipt.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-report-${{ matrix.arch }}
          path: |
            target/android-report
            apps/android/core/go.mod
            apps/android/core/go.sum
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  check:
    if: ${{ !inputs.refresh_dependencies }}
    name: ${{ matrix.system }}-${{ matrix.arch }}
    needs: inputs
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            python: '3.15'
          - os: windows-11-arm
            system: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            python: '3.15'
          - os: ubuntu-22.04
            system: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            python: '3.15'
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            python: '3.15'
          - os: macos-15-intel
            system: macos
            arch: x64
            python: '3.15'
            target: x86_64-apple-darwin
          - os: macos-latest
            system: macos
            arch: arm64
            python: '3.15'
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONUTF8: '1'
      COR_CI_EXTENDED_TESTS: ${{ needs.inputs.outputs.extended_tests }}
      COR_CI_LINUX_USER_TESTS: ${{ needs.inputs.outputs.linux_user_tests }}
      COR_CI_DESKTOP_UI_TESTS: ${{ needs.inputs.outputs.desktop_ui_tests }}
      COR_CI_PROXY_BENCHMARK: ${{ needs.inputs.outputs.proxy_benchmark }}
      COR_CI_UPDATE_TESTS: ${{ needs.inputs.outputs.update_tests }}
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Preserve one immutable source identity for PR builds and packaging.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Load approved tool versions
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'versions'], check=True)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && env.COR_PYTHON_WINDOWS_ARM64 || env.COR_PYTHON }}
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
      - name: Apply the resolved source dependency snapshot
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'apply'], check=True)
      - name: Remember original macOS DNS before cache login
        if: runner.os == 'macOS'
        id: original_dns
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/action_cache.py', 'network-save'], check=True)
      - name: Connect to private cache network
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        timeout-minutes: ${{ runner.os == 'macOS' && 8 || 3 }}
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.inputs.outputs.tailscale }}
          use-cache: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Restore macOS DNS after cache login
        if: always() && runner.os == 'macOS' && steps.original_dns.outcome == 'success'
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/action_cache.py', 'network-restore'], check=True)
      - name: Preserve host routing after private cache login
        if: steps.tailnet.outcome == 'success'
        shell: python
        run: |
          import os, shutil, subprocess
          # The official action supplies --accept-routes itself. Passing it a
          # second time is rejected; turn it off after login, before any tests.
          command = [shutil.which('tailscale') or 'tailscale', 'set', '--accept-routes=false', '--accept-dns=false']
          if os.name != 'nt': command = ['sudo', '-n', *command]
          subprocess.run(command, check=True)
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.COR_RUST }}-${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        timeout-minutes: 5
        continue-on-error: true
        id: rust_github
        with:
          prefix-key: ${{ runner.os == 'Linux' && 'native-release-ubuntu20-v1-' || 'native-release-v2-' }}${{ matrix.os }}
          key: ${{ (runner.os == 'macOS' || runner.os == 'Windows') && format('workspace-{0}', hashFiles('apps/**/*.rs', 'apps/**/*.slint', 'apps/**/*.svg', 'crates/**/*.rs', 'crates/**/*.slint', 'crates/**/*.svg', 'vendor/**/*.rs', 'vendor/**/*.java', 'resources/**')) || '' }}
          cache-on-failure: false
          cache-bin: false
          # Source hashes are checked before restoring workspace mtimes; changed
          # crates are invalidated explicitly, even for an older source branch.
          cache-workspace-crates: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
          cache-directories: ${{ runner.temp }}/workspace-sources
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Discard interrupted GitHub compiler restore
        if: steps.rust_github.outcome == 'failure'
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from action_cache import discard_restore
          discard_restore({'kind': 'rust', 'source': '.'})
      - name: Check whether native dependency objects were restored
        id: rust_paths
        run: |
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from action_cache import github_restored
          cargo = pathlib.Path(os.environ.get('CARGO_HOME', str(pathlib.Path.home()/'.cargo')))
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('WORKSPACE_SOURCE_CACHE=' + str(pathlib.Path(os.environ['RUNNER_TEMP'])/'workspace-sources/source.json') + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('needed=' + str(not github_restored({'kind':'rust', 'source':'.', 'github_hit':'false'})).lower() + '\n')
              for name, path in [('registry', cargo/'registry'), ('git', cargo/'git'), ('target', pathlib.Path('target').absolute())]:
                  output.write(name + '=' + str(path) + '\n')
      - name: Restore compatible GitHub workspace compilation
        id: rust_fallback
        if: steps.rust_paths.outputs.needed == 'true' && (runner.os == 'macOS' || runner.os == 'Windows')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        timeout-minutes: 5
        with:
          # A source-specific exact key must still restore prior dependency and
          # workspace objects. These paths match rust-cache's archive version.
          path: |
            ${{ steps.rust_paths.outputs.registry }}
            ${{ steps.rust_paths.outputs.git }}
            ${{ steps.rust_paths.outputs.target }}
            ${{ runner.temp }}/workspace-sources
          key: native-release-v2-${{ matrix.os }}-fallback-${{ github.run_id }}
          restore-keys: native-release-v2-${{ matrix.os }}-
      - name: Discard interrupted compatible GitHub restore
        if: steps.rust_fallback.outcome == 'failure'
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from action_cache import discard_restore
          discard_restore({'kind': 'rust', 'source': '.'})
      - name: Verify native architecture
        run: |
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from build_support import host_arch
          assert host_arch() == '${{ matrix.arch }}'
          assert 'host: ${{ matrix.target }}' in subprocess.check_output(['rustc', '-vV'], text=True)
      - name: Cache Ubuntu baseline downloads
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-download-cache
        timeout-minutes: 30
        continue-on-error: true
      - name: Prepare frozen native resources on the host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/prepare-resources.py', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}'], check=True)
      - name: Enqueue verified original downloads before compilation
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          checkpoint: 'true'
      - name: Compile, test and export native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          command = [sys.executable, 'scripts/run-ci.py', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}']
          if '${{ matrix.system }}' == 'macos':
              command = [sys.executable, 'scripts/macos_ci.py', 'ci', '--arch', '${{ matrix.arch }}']
          elif '${{ matrix.system }}' == 'linux':
              command = [sys.executable, 'scripts/linux_ci.py', 'ci']
          subprocess.run(command, check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: native_build
        with:
          name: build-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            dist/build/build.tar.gz
            dist/build/build.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Stage the uploaded native build without downloading it again
        env:
          BUILD_ARTIFACT_ID: ${{ steps.native_build.outputs.artifact-id }}
          BUILD_ARTIFACT_DIGEST: ${{ steps.native_build.outputs.artifact-digest }}
        run: |
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from workflow_artifacts import stage_local_build, commit
          stage_local_build(pathlib.Path('dist/build/build.tar.gz'), pathlib.Path('ci-build'),
              '${{ matrix.system }}', '${{ matrix.arch }}', commit(),
              int(os.environ['BUILD_ARTIFACT_ID']), os.environ['BUILD_ARTIFACT_DIGEST'])
      - name: Package and test installed native programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          if '${{ matrix.system }}' == 'linux':
              subprocess.run([sys.executable, 'scripts/linux_ci.py', 'package',
                  '--build', 'ci-build', '--ci-run-id', '${{ github.run_id }}'], check=True)
              subprocess.run([sys.executable, 'scripts/test-release-package.py',
                  '--linux-compat', '--expect-ubuntu', '22.04'], check=True)
          else:
              subprocess.run([sys.executable, 'scripts/test-release-package.py',
                  '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}',
                  '--build', 'ci-build', '--ci-run-id', '${{ github.run_id }}'], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: linux-tun-test-${{ matrix.arch }}
          path: dist/linux-tun-test
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*.deb
            dist/*.dmg
            dist/*.sha256
            dist/package-receipt.json
          if-no-files-found: error
          retention-days: 3
      - name: Collect macOS failure diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/macos_ci.py', 'diagnostics', '--arch', '${{ matrix.arch }}'], check=True)
      - name: Preserve macOS results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'macOS'
        with:
          name: macos-ci-report-${{ matrix.arch }}
          path: target/macos-report
          if-no-files-found: error
          retention-days: 3
      - name: Preserve Windows test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'Windows' && needs.inputs.outputs.extended_tests == 'true'
        with:
          name: windows-ci-report-${{ matrix.arch }}
          path: |
            target/windows-ci-report.json
            target/windows-gui-report.json
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve local proxy throughput measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && needs.inputs.outputs.proxy_benchmark == 'true'
        with:
          name: proxy-benchmark-${{ matrix.system }}-${{ matrix.arch }}
          path: target/proxy-benchmark-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve Linux package diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'Linux' && hashFiles('target/linux-report/**') != ''
        with:
          name: linux-package-report-${{ matrix.arch }}
          path: target/linux-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  ubuntu_latest:
    name: Ubuntu latest-x64 proxy and TUN
    if: ${{ !inputs.refresh_dependencies }}
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      COR_CI_EXTENDED_TESTS: ${{ needs.inputs.outputs.extended_tests }}
      COR_CI_LINUX_USER_TESTS: ${{ needs.inputs.outputs.linux_user_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - name: Connect to private system package cache
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        timeout-minutes: 3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.inputs.outputs.tailscale }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Preserve host routing
        if: steps.tailnet.outcome == 'success'
        run: sudo -n tailscale set --accept-routes=false --accept-dns=false
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - name: Wait for this CI run's verified Linux package
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/workflow_artifacts.py wait --system linux --arch x64 --run-id '${{ github.run_id }}' --timeout 3600
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package-linux-x64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-tun-test-x64
          path: target
      - name: Verify the candidate on Ubuntu latest
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/test-release-package.py --linux-compat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && hashFiles('target/linux-report/**') != ''
        with:
          name: linux-package-report-latest
          path: target/linux-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  ubuntu_20:
    name: Ubuntu 20.04-${{ matrix.arch }} installed proxy and TUN
    if: ${{ !inputs.refresh_dependencies }}
    needs: inputs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      COR_CI_EXTENDED_TESTS: ${{ needs.inputs.outputs.extended_tests }}
      COR_CI_LINUX_USER_TESTS: ${{ needs.inputs.outputs.linux_user_tests }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            qemu: qemu-system-x86
          - os: ubuntu-22.04-arm
            arch: arm64
            qemu: qemu-system-arm qemu-efi-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
      - name: Connect to private Linux download cache
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        timeout-minutes: 3
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.inputs.outputs.tailscale }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Preserve host routing after private cache login
        if: steps.tailnet.outcome == 'success'
        run: sudo -n tailscale set --accept-routes=false --accept-dns=false
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - name: Configure VM originals before prepared-image lookup
        uses: ./.github/actions/linux-download-cache
        timeout-minutes: 15
        continue-on-error: true
        with:
          vm: 'true'
          download-originals: 'false'
      - name: Install virtual machine tools
        shell: python
        env:
          QEMU_PACKAGES: ${{ matrix.qemu }}
        run: |
          import os, pathlib, subprocess
          import sys
          sys.path.insert(0, 'scripts')
          from linux_apt import OPTIONS, privileged, install
          os.environ['COR_LINUX_APT_CACHE'] = os.environ['COR_HOST_APT_CACHE']
          privileged([*OPTIONS, 'update'], 300)
          install([*os.environ['QEMU_PACKAGES'].split(), 'qemu-utils', 'cloud-image-utils'])
          if pathlib.Path('/dev/kvm').exists():
              subprocess.run(['sudo', 'chmod', 'a+rw', '/dev/kvm'], check=True)
          else:
              print('KVM is unavailable; keeping TCG software emulation.')
      - name: Enqueue verified VM originals before waiting
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          checkpoint: 'true'
      - name: Prepare Ubuntu 20.04 while the native candidate builds, then test it
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/linux_ci.py vm --package-run-id '${{ github.run_id }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && hashFiles('target/linux-report/**') != ''
        with:
          name: linux-package-report-ubuntu20-${{ matrix.arch }}
          path: target/linux-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  cache_budget:
    name: Actions cache budget
    needs: [inputs, android, check, ubuntu_latest, ubuntu_20]
    if: ${{ !cancelled() && !inputs.refresh_dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      id-token: write
    concurrency:
      group: actions-cache-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Report dependency upgrade and replacement candidates without applying them
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/build_inputs.py audit --directory target/dependency-audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-audit
          path: target/dependency-audit
          retention-days: 3
          if-no-files-found: error
      - name: Prioritize slow Rust compilation within the 9 GiB cache budget
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'scripts/workflow_storage.py']
          if os.environ['CACHE_READ_ONLY'] == 'true': command.append('--read-only')
          subprocess.run(command, check=True)
      - name: Connect for final private cache inventory
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.inputs.outputs.tailscale || '1.104.5' }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Report the cache after all successful uploads
        if: steps.tailnet.outcome == 'success'
        continue-on-error: true
        env:
          CACHE_URL: ${{ vars.LOCAL_CACHE_URL }}
          CACHE_TOKEN: ${{ secrets.LOCAL_CACHE_TOKEN }}
          CACHE_PROXY: http://127.0.0.1:19082
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sudo -n tailscale set --accept-routes=false --accept-dns=false
          python3 scripts/action_cache.py inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.tailnet.outcome == 'success'
        with:
          name: private-cache-inventory
          path: target/cache-inventory.json
          retention-days: 3
          if-no-files-found: warn
