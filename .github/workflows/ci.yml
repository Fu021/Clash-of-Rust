name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.system }}-${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            python: '3.11'
          - os: windows-11-arm
            system: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            python: '3.13'
          - os: ubuntu-22.04
            system: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            python: '3.11'
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: native-release-${{ matrix.os }}
          cache-on-failure: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Verify architecture and select resource cache date
        id: environment
        run: |
          import subprocess, sys, os, datetime
          sys.path.insert(0, 'scripts')
          from build_support import host_arch
          assert host_arch() == '${{ matrix.arch }}'
          assert 'host: ${{ matrix.target }}' in subprocess.check_output(['rustc', '-vV'], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('day=' + datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d') + '\n')
      - uses: actions/cache@v4
        with:
          path: |
            bin
            bundle
          key: resources-${{ matrix.system }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-resources.py', 'scripts/build_support.py') }}-${{ steps.environment.outputs.day }}
          restore-keys: |
            resources-${{ matrix.system }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-resources.py', 'scripts/build_support.py') }}-
      - name: Install Linux build/test dependencies
        if: runner.os == 'Linux'
        run: |
          import subprocess
          subprocess.run(['sudo', 'apt-get', 'update'], check=True)
          subprocess.run(['sudo', 'apt-get', 'install', '-y', 'libglib2.0-dev', 'libxkbcommon-dev', 'libwayland-dev', 'libx11-dev', 'libx11-xcb-dev', 'gsettings-desktop-schemas', 'dbus'], check=True)
      - name: Compile, test and export native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/run-ci.py', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}'], check=True)
      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            dist/build/build.tar.gz
            dist/build/build.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
