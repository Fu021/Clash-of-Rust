name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  BUILD_INPUTS_DIR: target/dependency-snapshot
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inputs:
    name: Resolve build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      resources: ${{ steps.resolve.outputs.resources }}
      tailscale: ${{ steps.resolve.outputs.tailscale }}
      sccache: ${{ steps.resolve.outputs.sccache }}
      gradle: ${{ steps.resolve.outputs.gradle }}
      nsis: ${{ steps.resolve.outputs.nsis }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          check-latest: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        id: go
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Connect for dependency snapshot fallback
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: '1.94.2'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Keep runner routing unchanged
        if: steps.tailnet.outcome == 'success'
        run: sudo -n tailscale set --accept-routes=false --accept-dns=false
      - name: Restore source registry metadata and verified archives
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: dependencies/cargo-source
          paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: source-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-
      - name: Restore source module downloads and binding tools
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: tools/android-go
          paths: |
            ~/go/pkg/mod
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: go-resolver-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/android/core/go.*') }}
          restore-keys: go-
      - name: Restore last compatible dependency snapshot
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: dependencies/build-inputs
          paths: target/dependency-snapshot
          key: source-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'apps/**/Cargo.toml', 'crates/**/Cargo.toml', '.cargo/**', 'apps/android/core/go.*', 'apps/android/**/*.gradle.kts', 'apps/android/gradle.properties') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'apps/**/Cargo.toml', 'crates/**/Cargo.toml', '.cargo/**', 'apps/android/core/go.*', 'apps/android/**/*.gradle.kts', 'apps/android/gradle.properties') }}-
      - name: Check upstream and freeze source dependencies
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/build_inputs.py resolve
      - uses: actions/upload-artifact@v6
        with:
          name: dependency-snapshot
          path: target/dependency-snapshot
          retention-days: 3
          if-no-files-found: error
  android:
    name: android-${{ matrix.arch }}
    needs: inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
          - arch: armv7
            target: armv7-linux-androideabi
          - arch: x64
            target: x86_64-linux-android
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ANDROID_CI_TEST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          check-latest: true
      - uses: actions/download-artifact@v7
        with:
          name: dependency-snapshot
          path: target/dependency-snapshot
      - name: Apply the resolved source dependency snapshot
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'apply'], check=True)
      - name: Connect to private cache network
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.inputs.outputs.tailscale }}
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Preserve host routing after private cache login
        if: steps.tailnet.outcome == 'success'
        shell: python
        run: |
          import os, shutil, subprocess
          # The official action supplies --accept-routes itself. Passing it a
          # second time is rejected; turn it off after login, before any tests.
          command = [shutil.which('tailscale') or 'tailscale', 'set', '--accept-routes=false', '--accept-dns=false']
          if os.name != 'nt': command = ['sudo', '-n', *command]
          subprocess.run(command, check=True)
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Restore private Android Rust cache
        id: rust_local
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: rust/android-${{ matrix.arch }}
          kind: rust
          key: release-${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: steps.rust_local.outputs.restored != 'true'
        timeout-minutes: 5
        continue-on-error: true
        with:
          prefix-key: android-v2-${{ matrix.arch }}
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: false
          # Bootstrap from existing GitHub caches once; new snapshots go local.
          save-if: false
      - name: Identify Skia source dependency
        if: matrix.arch == 'armv7'
        id: skia
        shell: python
        run: |
          import os, pathlib, tomllib
          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          package = next(p for p in lock['package'] if p['name'] == 'skia-bindings')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + package['version'] + '\n')
              output.write('checksum=' + package['checksum'] + '\n')
      - name: Restore private ARMv7 Skia source dependencies
        id: skia_local
        if: matrix.arch == 'armv7'
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: dependencies/skia-armv7
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.skia.outputs.version }}-${{ steps.skia.outputs.checksum }}
          paths: ~/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/skia-bindings-${{ steps.skia.outputs.version }}
      - name: Bootstrap existing ARMv7 Skia source cache
        if: matrix.arch == 'armv7' && steps.skia_local.outputs.restored != 'true'
        uses: actions/cache/restore@v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          # Cargo's normal registry cache excludes the sources downloaded by
          # Skia's build script. Include the crate's unpack marker as well, so
          # Cargo will not discard this tree when extracting the crate again.
          path: ~/.cargo/registry/src/*/skia-bindings-${{ steps.skia.outputs.version }}
          key: skia-source-${{ runner.os }}-${{ runner.arch }}-${{ steps.skia.outputs.version }}-${{ steps.skia.outputs.checksum }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        id: go
        with:
          go-version-file: apps/android/core/go.mod
          check-latest: true
          # Cache modules/tools below; the Go build directory is disposable.
          cache: false
      - name: Restore private Go dependencies and binding tools
        id: go_local
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: tools/android-go
          paths: |
            ~/go/pkg/mod
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/android/core/go.mod', 'apps/android/core/go.sum', 'scripts/android.py') }}
          restore-keys: go-
      - name: Bootstrap existing Go cache
        if: steps.go_local.outputs.restored != 'true'
        uses: actions/cache/restore@v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: android-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/android/core/go.mod', 'apps/android/core/go.sum') }}
          restore-keys: android-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Restore private Gradle dependencies and distribution
        id: gradle_local
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: dependencies/gradle-linux
          key: gradle-${{ needs.inputs.outputs.gradle }}-java-17-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle.properties') }}
          paths: |
            ~/.gradle/caches/modules-2
            ~/.gradle/permwrapper/dists
            ~/.gradle/wrapper/dists
          restore-keys: gradle-
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ needs.inputs.outputs.gradle }}
          cache-disabled: ${{ steps.gradle_local.outputs.restored == 'true' }}
          cache-read-only: true
          cache-cleanup: on-success
          gradle-home-cache-includes: caches/modules-2
      - name: Load stable development signature when configured
        shell: python
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE }}
          DEV_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
        run: |
          import base64, os, pathlib
          if os.environ.get('DEV_KEYSTORE') and os.environ.get('DEV_PASSWORD'):
              password=os.environ['DEV_PASSWORD']
              if '\n' in password or '\r' in password: raise ValueError('Invalid signing password')
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-development.p12'
              path.write_bytes(base64.b64decode(os.environ['DEV_KEYSTORE'],validate=True))
              path.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write('ANDROID_KEYSTORE_PATH='+str(path)+'\n')
                  out.write('ANDROID_KEY_ALIAS=cor-android-dev\n')
                  out.write('ANDROID_KEYSTORE_PASSWORD='+password+'\n')
                  out.write('ANDROID_KEY_PASSWORD='+password+'\n')
          else:
              print('Using an ephemeral CI test signature; APKs from different CI runs cannot replace one another.')
      - name: Prepare Android toolchain
        shell: python
        run: |
          import os, pathlib, subprocess
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])
          manager=sdk/'cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([str(manager),'platforms;android-36','build-tools;36.0.0','ndk;28.2.13676358'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('ANDROID_NDK_ROOT='+str(sdk/'ndk/28.2.13676358')+'\n')
      - name: Restore shared verified Android Geo resources
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: resources/android
          paths: apps/android/app/offline-assets
          key: resources-${{ needs.inputs.outputs.resources }}
          restore-keys: resources-
      - name: Compile Android application and embedded core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android.py build --arch ${{ matrix.arch }}
      - name: Start Android test device
        if: matrix.arch == 'x64'
        run: |
          sudo chmod a+rw /dev/kvm
          python3 scripts/android.py emulator --arch x64
      - name: Verify real Android proxy and TUN traffic
        if: matrix.arch == 'x64'
        run: python3 scripts/android.py test --arch x64
      - name: Export tested Android compilation
        run: python3 scripts/android.py export --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: build-android-${{ matrix.arch }}
          path: |
            dist/android-build/build.tar.gz
            dist/android-build/build.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-report-${{ matrix.arch }}
          path: |
            target/android-report
            apps/android/core/go.mod
            apps/android/core/go.sum
          if-no-files-found: warn
          retention-days: 3
  check:
    name: ${{ matrix.system }}-${{ matrix.arch }}
    needs: inputs
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            python: '3.11'
          - os: windows-11-arm
            system: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            python: '3.13'
          - os: ubuntu-22.04
            system: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            python: '3.11'
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            python: '3.11'
          - os: macos-15-intel
            system: macos
            arch: x64
            python: '3.11'
            target: x86_64-apple-darwin
          - os: macos-latest
            system: macos
            arch: arm64
            python: '3.11'
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@v6
        with:
          # Preserve one immutable source identity for PR builds and packaging.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v7
        with:
          name: dependency-snapshot
          path: target/dependency-snapshot
      - name: Apply the resolved source dependency snapshot
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'apply'], check=True)
      - name: Connect to private cache network
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.inputs.outputs.tailscale }}
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Preserve host routing after private cache login
        if: steps.tailnet.outcome == 'success'
        shell: python
        run: |
          import os, shutil, subprocess
          # The official action supplies --accept-routes itself. Passing it a
          # second time is rejected; turn it off after login, before any tests.
          command = [shutil.which('tailscale') or 'tailscale', 'set', '--accept-routes=false', '--accept-dns=false']
          if os.name != 'nt': command = ['sudo', '-n', *command]
          subprocess.run(command, check=True)
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
          components: rustfmt, clippy
      - name: Restore private native Rust cache
        id: rust_local
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: rust/${{ matrix.system }}-${{ matrix.arch }}
          kind: rust
          key: release-${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: steps.rust_local.outputs.restored != 'true'
        timeout-minutes: 5
        continue-on-error: true
        with:
          prefix-key: native-release-v2-${{ matrix.os }}
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: ${{ runner.os == 'macOS' }}
          save-if: false
      - name: Verify architecture and select resource cache date
        id: environment
        run: |
          import subprocess, sys, os, datetime, hashlib, pathlib
          sys.path.insert(0, 'scripts')
          from build_support import host_arch
          assert host_arch() == '${{ matrix.arch }}'
          assert 'host: ${{ matrix.target }}' in subprocess.check_output(['rustc', '-vV'], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('day=' + datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d') + '\n')
              output.write('compiler=' + hashlib.sha256(subprocess.check_output(['rustc', '-vV'])).hexdigest()[:16] + '\n')
          if sys.platform == 'darwin':
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('SCCACHE_DIR=' + str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'compiler-cache') + '\n')
                  env.write('SCCACHE_CACHE_SIZE=512M\n')
                  env.write('SCCACHE_BASEDIRS=' + os.environ['GITHUB_WORKSPACE'] + '\n')
      - name: Install macOS compiler cache
        if: runner.os == 'macOS'
        id: compiler_cache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
        with:
          version: ${{ needs.inputs.outputs.sccache }}
          disable_annotations: true
      - name: Restore bounded macOS compilation results
        if: runner.os == 'macOS' && steps.compiler_cache.outcome == 'success'
        id: compiler_local
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: compiler/macos-${{ matrix.arch }}
          paths: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.environment.outputs.compiler }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'apps/**/*.rs', 'apps/**/Cargo.toml', 'crates/**/*.rs', 'crates/**/*.slint', 'crates/**/Cargo.toml', 'resources/**', 'scripts/*.py', '.github/workflows/ci.yml') }}
          restore-keys: ${{ steps.environment.outputs.compiler }}-
      - name: Bootstrap existing macOS compiler cache
        if: runner.os == 'macOS' && steps.compiler_cache.outcome == 'success' && steps.compiler_local.outputs.restored != 'true'
        uses: actions/cache/restore@v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: macos-compiler-${{ matrix.arch }}-${{ steps.environment.outputs.compiler }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'apps/**/*.rs', 'apps/**/Cargo.toml', 'crates/**/*.rs', 'crates/**/*.slint', 'crates/**/Cargo.toml', 'resources/**', 'scripts/*.py', '.github/workflows/ci.yml') }}
          restore-keys: macos-compiler-${{ matrix.arch }}-${{ steps.environment.outputs.compiler }}-
      - name: Enable macOS compiler cache
        if: runner.os == 'macOS' && steps.compiler_cache.outcome == 'success'
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RUSTC_WRAPPER=' + os.environ['SCCACHE_PATH'] + '\n')
      - name: Restore private core and Geo resources
        id: resource_local
        uses: ./.github/actions/local-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
          group: resources/${{ matrix.system }}-${{ matrix.arch }}
          paths: ${{ matrix.system == 'windows' && matrix.arch == 'x64' && 'bundle/resources' || format('bundle/{0}-{1}/resources', matrix.system, matrix.arch) }}
          key: resources-${{ needs.inputs.outputs.resources }}
          restore-keys: resources-
      - name: Bootstrap existing resource cache
        if: steps.resource_local.outputs.restored != 'true'
        uses: actions/cache/restore@v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          # Only downloaded core/Geo dependencies. Never cache our own binaries.
          path: |
            bin
            bundle/resources
            bundle/${{ matrix.system }}-${{ matrix.arch }}/resources
          key: resources-${{ matrix.system }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-resources.py', 'scripts/build_support.py') }}-${{ steps.environment.outputs.day }}
          restore-keys: |
            resources-${{ matrix.system }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-resources.py', 'scripts/build_support.py') }}-
      - name: Install Linux build/test dependencies
        if: runner.os == 'Linux'
        run: |
          import subprocess
          subprocess.run(['sudo', 'apt-get', 'update'], check=True)
          subprocess.run(['sudo', 'apt-get', 'install', '-y', 'libglib2.0-dev', 'libfontconfig1-dev', 'libfreetype6-dev', 'libxkbcommon-dev', 'libwayland-dev', 'libx11-dev', 'libx11-xcb-dev', 'gsettings-desktop-schemas', 'dbus', 'libxkbcommon-x11-0', 'libxcursor1', 'libxrandr2', 'libxi6', 'libxinerama1', 'libegl1', 'iproute2', 'util-linux', 'libcap2-bin', 'systemd'], check=True)
      - name: Compile, test and export native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          command = [sys.executable, 'scripts/run-ci.py', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}']
          if '${{ matrix.system }}' == 'macos':
              command = [sys.executable, 'scripts/macos_ci.py', 'ci', '--arch', '${{ matrix.arch }}']
          subprocess.run(command, check=True)
      - name: Report macOS compiler cache hits
        if: always() && runner.os == 'macOS' && steps.compiler_cache.outcome == 'success'
        continue-on-error: true
        run: |
          import os, pathlib, subprocess
          result = subprocess.run([os.environ['SCCACHE_PATH'], '--stop-server'], text=True, capture_output=True)
          print(result.stdout)
          with pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write('### macOS compiler cache (512 MiB cap)\n```text\n' + result.stdout + '\n```\n')
      - name: Collect macOS failure diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/macos_ci.py', 'diagnostics', '--arch', '${{ matrix.arch }}'], check=True)
      - name: Preserve macOS results
        uses: actions/upload-artifact@v6
        if: always() && runner.os == 'macOS'
        with:
          name: macos-ci-report-${{ matrix.arch }}
          path: target/macos-report
          if-no-files-found: error
          retention-days: 3
      - name: Preserve Windows basic test results
        uses: actions/upload-artifact@v6
        if: always() && runner.os == 'Windows'
        with:
          name: windows-ci-report-${{ matrix.arch }}
          path: target/windows-ci-report.json
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            dist/build/build.tar.gz
            dist/build/build.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  cache_budget:
    name: Actions cache budget
    needs: [inputs, android, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      id-token: write
    concurrency:
      group: actions-cache-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Trim obsolete dependencies and enforce 8 GiB cache budget
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'scripts/workflow_storage.py']
          if os.environ['CACHE_READ_ONLY'] == 'true': command.append('--read-only')
          subprocess.run(command, check=True)
      - name: Connect for final private cache inventory
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: tailscale/github-action@v4
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.inputs.outputs.tailscale || '1.94.2' }}
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Report the cache after all successful uploads
        if: steps.tailnet.outcome == 'success'
        continue-on-error: true
        env:
          CACHE_URL: ${{ vars.LOCAL_CACHE_URL }}
          CACHE_TOKEN: ${{ secrets.LOCAL_CACHE_TOKEN }}
          CACHE_PROXY: http://127.0.0.1:19082
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sudo -n tailscale set --accept-routes=false --accept-dns=false
          python3 scripts/action_cache.py inventory
      - uses: actions/upload-artifact@v6
        if: steps.tailnet.outcome == 'success'
        with:
          name: private-cache-inventory
          path: target/cache-inventory.json
          retention-days: 3
          if-no-files-found: warn
