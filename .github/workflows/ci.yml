name: Rust
on:
  push:
    branches: [main]
  pull_request:
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: android-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
          - arch: armv7
            target: armv7-linux-androideabi
          - arch: x64
            target: x86_64-linux-android
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ANDROID_CI_TEST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        continue-on-error: true
        with:
          prefix-key: android-${{ matrix.arch }}
          cache-on-failure: true
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        id: go
        with:
          go-version-file: apps/android/core/go.mod
          # Cache modules/tools below; the Go build directory is disposable.
          cache: false
      - name: Cache Android Go dependencies and binding tools
        uses: actions/cache@v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: android-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/android/core/go.mod', 'apps/android/core/go.sum') }}
          restore-keys: android-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
          # One matrix leg writes the shared downloaded modules, not one per ABI.
          cache-read-only: ${{ matrix.arch != 'x64' }}
          cache-cleanup: on-success
          gradle-home-cache-includes: caches/modules-2
      - name: Load stable development signature when configured
        shell: python
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE }}
          DEV_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
        run: |
          import base64, os, pathlib
          if os.environ.get('DEV_KEYSTORE') and os.environ.get('DEV_PASSWORD'):
              password=os.environ['DEV_PASSWORD']
              if '\n' in password or '\r' in password: raise ValueError('Invalid signing password')
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-development.p12'
              path.write_bytes(base64.b64decode(os.environ['DEV_KEYSTORE'],validate=True))
              path.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write('ANDROID_KEYSTORE_PATH='+str(path)+'\n')
                  out.write('ANDROID_KEY_ALIAS=cor-android-dev\n')
                  out.write('ANDROID_KEYSTORE_PASSWORD='+password+'\n')
                  out.write('ANDROID_KEY_PASSWORD='+password+'\n')
          else:
              print('Using an ephemeral CI test signature; APKs from different CI runs cannot replace one another.')
      - name: Prepare Android toolchain
        shell: python
        run: |
          import os, pathlib, subprocess
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])
          manager=sdk/'cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([str(manager),'platforms;android-36','build-tools;36.0.0','ndk;28.2.13676358'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('ANDROID_NDK_ROOT='+str(sdk/'ndk/28.2.13676358')+'\n')
      - name: Compile Android application and embedded core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android.py build --arch ${{ matrix.arch }}
      - name: Start Android test device
        if: matrix.arch == 'x64'
        run: |
          sudo chmod a+rw /dev/kvm
          python3 scripts/android.py emulator --arch x64
      - name: Verify real Android proxy and TUN traffic
        if: matrix.arch == 'x64'
        run: python3 scripts/android.py test --arch x64
      - name: Export tested Android compilation
        run: python3 scripts/android.py export --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: build-android-${{ matrix.arch }}
          path: |
            dist/android-build/build.tar.gz
            dist/android-build/build.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-report-${{ matrix.arch }}
          path: |
            target/android-report
            apps/android/core/go.mod
            apps/android/core/go.sum
          if-no-files-found: warn
          retention-days: 14
  check:
    name: ${{ matrix.system }}-${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            python: '3.11'
          - os: windows-11-arm
            system: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            python: '3.13'
          - os: ubuntu-22.04
            system: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            python: '3.11'
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            python: '3.11'
          - os: macos-15-intel
            system: macos
            arch: x64
            python: '3.11'
            target: x86_64-apple-darwin
          - os: macos-latest
            system: macos
            arch: arm64
            python: '3.11'
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@v6
        with:
          # Preserve one immutable source identity for PR builds and packaging.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        continue-on-error: true
        with:
          prefix-key: native-release-${{ matrix.os }}
          cache-on-failure: true
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Verify architecture and select resource cache date
        id: environment
        run: |
          import subprocess, sys, os, datetime
          sys.path.insert(0, 'scripts')
          from build_support import host_arch
          assert host_arch() == '${{ matrix.arch }}'
          assert 'host: ${{ matrix.target }}' in subprocess.check_output(['rustc', '-vV'], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('day=' + datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d') + '\n')
      - uses: actions/cache@v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          # Only downloaded core/Geo dependencies. Never cache our own binaries.
          path: |
            bin
            bundle/resources
            bundle/${{ matrix.system }}-${{ matrix.arch }}/resources
          key: resources-${{ matrix.system }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-resources.py', 'scripts/build_support.py') }}-${{ steps.environment.outputs.day }}
          restore-keys: |
            resources-${{ matrix.system }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-resources.py', 'scripts/build_support.py') }}-
      - name: Install Linux build/test dependencies
        if: runner.os == 'Linux'
        run: |
          import subprocess
          subprocess.run(['sudo', 'apt-get', 'update'], check=True)
          subprocess.run(['sudo', 'apt-get', 'install', '-y', 'libglib2.0-dev', 'libfontconfig1-dev', 'libfreetype6-dev', 'libxkbcommon-dev', 'libwayland-dev', 'libx11-dev', 'libx11-xcb-dev', 'gsettings-desktop-schemas', 'dbus', 'libxkbcommon-x11-0', 'libxcursor1', 'libxrandr2', 'libxi6', 'libxinerama1', 'libegl1', 'iproute2', 'util-linux', 'libcap2-bin', 'systemd'], check=True)
      - name: Compile, test and export native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          command = [sys.executable, 'scripts/run-ci.py', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}']
          if '${{ matrix.system }}' == 'macos':
              command = [sys.executable, 'scripts/macos_ci.py', 'ci', '--arch', '${{ matrix.arch }}']
          subprocess.run(command, check=True)
      - name: Collect macOS failure diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/macos_ci.py', 'diagnostics', '--arch', '${{ matrix.arch }}'], check=True)
      - name: Preserve macOS results
        uses: actions/upload-artifact@v6
        if: always() && runner.os == 'macOS'
        with:
          name: macos-${{ github.workflow == 'Rust' && 'ci' || 'package' }}-report-${{ matrix.arch }}
          path: target/macos-report
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows basic test results
        uses: actions/upload-artifact@v6
        if: always() && runner.os == 'Windows'
        with:
          name: windows-ci-report-${{ matrix.arch }}
          path: target/windows-ci-report.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            dist/build/build.tar.gz
            dist/build/build.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  cache_budget:
    name: Actions cache budget
    needs: [android, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    concurrency:
      group: actions-cache-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Trim obsolete dependencies and enforce 8 GiB cache budget
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'scripts/workflow_storage.py']
          if os.environ['CACHE_READ_ONLY'] == 'true': command.append('--read-only')
          subprocess.run(command, check=True)
