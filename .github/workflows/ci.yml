name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: Resolve updated Cargo/Go lockfiles for a subsequent reviewed commit
        type: boolean
        default: false
      extended_tests:
        description: Run optional source, UI and platform regression suites
        type: boolean
        default: false
      proxy_benchmark:
        description: Compare desktop loopback proxy throughput and local node latency
        type: boolean
        default: false
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  ZSTD_CLEVEL: '1'
  BUILD_INPUTS_DIR: dependency-snapshot
  RUST_BACKTRACE: '1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  website:
    if: ${{ !inputs.refresh_dependencies }}
    name: Website validation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select website checks
        id: scope
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, 'scripts')
          from ci_test_policy import changed_paths
          try:
              selected = any(path.startswith('website/') or path == '.github/workflows/ci.yml'
                             for path in changed_paths())
          except Exception:
              selected = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('check=' + str(selected).lower() + '\n')
      - name: Validate static pages and assets
        if: steps.scope.outputs.check == 'true'
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/website-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 -B website/test_build.py
          node --check website/src/site.js
          node --check website/browser_check.cjs
      - name: Install browser test dependencies
        if: steps.scope.outputs.check == 'true'
        working-directory: website
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium --only-shell
      - name: Check desktop and mobile website pages
        if: steps.scope.outputs.check == 'true'
        working-directory: website
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.scope.outputs.check == 'true' }}
        with:
          name: website-browser-report
          path: website/browser-report
          retention-days: 3
          if-no-files-found: warn
  inputs:
    name: Resolve build inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      go: ${{ steps.go.outputs.go-version }}
      java: ${{ steps.versions.outputs.java }}
      resources: ${{ steps.resolve.outputs.resources }}
      nsis: ${{ steps.resolve.outputs.nsis }}
      extended_tests: ${{ steps.test_policy.outputs.extended_tests }}
      android_routing_tests: ${{ steps.test_policy.outputs.android_routing_tests }}
      android_diagnostics_tests: ${{ steps.test_policy.outputs.android_diagnostics_tests }}
      linux_user_tests: ${{ steps.test_policy.outputs.linux_user_tests }}
      desktop_ui_tests: ${{ steps.test_policy.outputs.desktop_ui_tests }}
      mobile_ui_tests: ${{ steps.test_policy.outputs.mobile_ui_tests }}
      proxy_benchmark: ${{ steps.test_policy.outputs.proxy_benchmark }}
      update_tests: ${{ steps.test_policy.outputs.update_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Test cache restore retry behavior
        run: node --test scripts/test-cache-restore.cjs
      - name: Select optional regression tests
        id: test_policy
        env:
          COR_CI_EXTENDED_TESTS: ${{ inputs.extended_tests && 'true' || 'false' }}
          COR_CI_PROXY_BENCHMARK: ${{ inputs.proxy_benchmark && 'true' || 'false' }}
        run: python3 scripts/ci_test_policy.py
      - name: Load approved tool versions
        id: versions
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - name: Validate common build and package logic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/test-build-tools.py --buffer
          python3 scripts/test-workflow-artifacts.py --buffer
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: go
        with:
          go-version: ${{ env.COR_GO }}
          cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        if: inputs.refresh_dependencies
        with:
          toolchain: ${{ env.COR_RUST }}
      - name: Resolve updated source lockfiles
        if: inputs.refresh_dependencies
        run: python3 scripts/build_inputs.py refresh --directory target/dependency-updates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.refresh_dependencies
        with:
          name: dependency-updates
          path: target/dependency-updates
          retention-days: 3
          if-no-files-found: error
      - name: Freeze approved source dependencies without updating versions
        if: ${{ !inputs.refresh_dependencies }}
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          COR_UBUNTU_VM_INPUTS: 'true'
        run: python3 scripts/build_inputs.py resolve
      - name: Prepare shared Android source downloads
        if: ${{ !inputs.refresh_dependencies }}
        run: python3 scripts/build_inputs.py share-go --directory target/shared-go
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !inputs.refresh_dependencies }}
        with:
          name: android-shared-dependencies
          path: target/shared-go
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !inputs.refresh_dependencies }}
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
          retention-days: 3
          if-no-files-found: error
  android_maven:
    if: ${{ !inputs.refresh_dependencies }}
    name: Prepare Android Maven dependencies
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ANDROID_CI_TEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set the isolated Gradle home
        run: printf 'GRADLE_USER_HOME=%s/cor-android-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Look up Android Maven dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/modules-2
          key: >-
            android-maven-v1-ubuntu-24.04-x64-${{ hashFiles('.github/build-versions.json',
            'apps/android/**/*.gradle', 'apps/android/**/*.gradle.kts',
            'apps/android/**/gradle.properties', 'apps/android/**/gradle/*.toml',
            'apps/android/**/gradle/verification-metadata.xml',
            'apps/android/**/gradle.lockfile', 'apps/android/**/dependency-locks/*.lockfile') }}
          lookup-only: true
      - name: Restore Android Maven dependencies with retries
        id: maven_cache
        uses: ./.github/actions/cache-restore-retry
        timeout-minutes: 25
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/modules-2
          key: >-
            android-maven-v1-ubuntu-24.04-x64-${{ hashFiles('.github/build-versions.json',
            'apps/android/**/*.gradle', 'apps/android/**/*.gradle.kts',
            'apps/android/**/gradle.properties', 'apps/android/**/gradle/*.toml',
            'apps/android/**/gradle/verification-metadata.xml',
            'apps/android/**/gradle.lockfile', 'apps/android/**/dependency-locks/*.lockfile') }}
          cleanup: maven
      - name: Load approved tool versions
        if: steps.maven_cache.outputs.cache-hit != 'true'
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: steps.maven_cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.COR_PYTHON }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.maven_cache.outputs.cache-hit != 'true'
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
      - name: Apply the resolved source dependency snapshot
        if: steps.maven_cache.outputs.cache-hit != 'true'
        run: python3 scripts/build_inputs.py apply
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.maven_cache.outputs.cache-hit != 'true'
        with:
          name: android-shared-dependencies
          path: target/shared-go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: steps.maven_cache.outputs.cache-hit != 'true'
        with:
          go-version: ${{ needs.inputs.outputs.go }}
          cache: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        if: steps.maven_cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: ${{ needs.inputs.outputs.java }}
      - name: Prepare verified Go downloads and Gradle
        if: steps.maven_cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/build_inputs.py restore-go --directory target/shared-go
          python3 scripts/build_inputs.py prepare-gradle --directory "$RUNNER_TEMP/cor-gradle"
      - name: Prepare Android SDK and NDK for the dependency build
        if: steps.maven_cache.outputs.cache-hit != 'true'
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from android import prepare_sdk
          from build_inputs import check_tools
          check_tools(('go', 'java', 'gradle'))
          prepare_sdk()
      - name: Resolve Maven dependencies online and verify them offline
        if: steps.maven_cache.outputs.cache-hit != 'true'
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from android import prepare_maven_cache
          prepare_maven_cache()
      - name: Share Maven dependencies with all Android ABIs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-maven-dependencies
          path: ${{ env.GRADLE_USER_HOME }}/caches/modules-2
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Save verified Android Maven dependencies for main
        if: github.ref == 'refs/heads/main' && steps.maven_cache.outputs.cache-hit != 'true' && steps.maven_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/modules-2
          key: ${{ steps.maven_cache.outputs.cache-primary-key }}
  android:
    if: ${{ !inputs.refresh_dependencies }}
    name: android-${{ matrix.arch }}
    needs: [inputs, android_maven]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
          - arch: armv7
            target: armv7-linux-androideabi
          - arch: x64
            target: x86_64-linux-android
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ANDROID_CI_TEST: '1'
      GOCACHE: ${{ github.workspace }}/.go-build
      WORKSPACE_SOURCE_CACHE: ${{ github.workspace }}/.workspace-sources/source.json
      COR_CI_EXTENDED_TESTS: ${{ needs.inputs.outputs.extended_tests }}
      COR_CI_ANDROID_ROUTING_TESTS: ${{ needs.inputs.outputs.android_routing_tests }}
      COR_CI_ANDROID_DIAGNOSTICS_TESTS: ${{ needs.inputs.outputs.android_diagnostics_tests }}
      COR_CI_MOBILE_UI_TESTS: ${{ needs.inputs.outputs.mobile_ui_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Load approved tool versions
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'versions'], check=True)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
      - name: Apply the resolved source dependency snapshot
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'apply'], check=True)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.COR_RUST }}
          targets: ${{ matrix.target }}
          components: clippy
      - name: Identify compatible Android compiler objects
        id: rust_identity
        shell: python
        run: |
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from action_cache import workspace_restore_identity
          identity = workspace_restore_identity('.', 'android-main-v4-${{ matrix.arch }}',
              pathlib.Path(os.environ['WORKSPACE_SOURCE_CACHE']).resolve().parent)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('prefix=' + identity['prefix'] + '\nlegacy_prefix=' + identity['legacy_prefix'] + '\npaths<<CACHE_PATHS\n' +
                  '\n'.join(identity['paths']) + '\nCACHE_PATHS\n')
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        timeout-minutes: 5
        continue-on-error: true
        id: rust_github
        with:
          prefix-key: ${{ steps.rust_identity.outputs.prefix }}
          key: workspace-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/build-versions.json', 'apps/**', 'crates/**', 'vendor/**', 'resources/**') }}
          cache-on-failure: false
          cache-bin: false
          cache-workspace-crates: true
          cache-directories: ${{ github.workspace }}/.workspace-sources
          save-if: ${{ github.ref == 'refs/heads/main' }}
          lookup-only: true
      - name: Look up compatible Android workspace objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ steps.rust_identity.outputs.paths }}
          key: ${{ steps.rust_identity.outputs.prefix }}-compatible-lookup
          restore-keys: |
            ${{ steps.rust_identity.outputs.prefix }}-
            ${{ steps.rust_identity.outputs.legacy_prefix }}-
          lookup-only: true
      - name: Restore Android workspace with retries
        id: rust_fallback
        uses: ./.github/actions/cache-restore-retry
        timeout-minutes: 25
        with:
          path: ${{ steps.rust_identity.outputs.paths }}
          key: ${{ steps.rust_identity.outputs.prefix }}-workspace-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/build-versions.json', 'apps/**', 'crates/**', 'vendor/**', 'resources/**') }}
          restore-keys: |
            ${{ steps.rust_identity.outputs.prefix }}-
            ${{ steps.rust_identity.outputs.legacy_prefix }}-
          cleanup: compiler
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-shared-dependencies
          path: target/shared-go
      - name: Restore verified shared source downloads
        run: python3 scripts/build_inputs.py restore-go --directory target/shared-go
      - name: Restore Android Go compilation with retries
        id: go_cache
        uses: ./.github/actions/cache-restore-retry
        timeout-minutes: 25
        with:
          path: ${{ env.GOCACHE }}
          key: android-go-build-v1-${{ matrix.arch }}-${{ hashFiles('.github/build-versions.json', 'apps/android/core/go.mod', 'apps/android/core/go.sum', 'apps/android/core/**/*.go') }}
          restore-keys: android-go-build-v1-${{ matrix.arch }}-
          cleanup: go
      - name: Prepare Gradle from a verified distribution
        run: python3 scripts/build_inputs.py prepare-gradle --directory '${{ runner.temp }}/cor-gradle'
      - name: Set the isolated Gradle home
        run: printf 'GRADLE_USER_HOME=%s/cor-android-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Load the shared Maven dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-maven-dependencies
          path: ${{ env.GRADLE_USER_HOME }}/caches/modules-2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: ${{ env.COR_JAVA }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: go
        with:
          go-version: ${{ needs.inputs.outputs.go }}
          cache: false
      - name: Verify approved Android build tools before compiling
        run: python3 scripts/build_inputs.py check-tools --tools go java gradle
      - name: Load stable development signature when configured
        shell: python
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE }}
          DEV_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
        run: |
          import base64, os, pathlib
          if os.environ.get('DEV_KEYSTORE') and os.environ.get('DEV_PASSWORD'):
              password=os.environ['DEV_PASSWORD']
              if '\n' in password or '\r' in password: raise ValueError('Invalid signing password')
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-development.p12'
              path.write_bytes(base64.b64decode(os.environ['DEV_KEYSTORE'],validate=True))
              path.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write('ANDROID_KEYSTORE_PATH='+str(path)+'\n')
                  out.write('ANDROID_KEY_ALIAS=cor-android-dev\n')
                  out.write('ANDROID_KEYSTORE_PASSWORD='+password+'\n')
                  out.write('ANDROID_KEY_PASSWORD='+password+'\n')
          else:
              print('Using an ephemeral CI test signature; APKs from different CI runs cannot replace one another.')
      - name: Prepare Android toolchain
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from android import prepare_sdk
          prepare_sdk()
      - name: Install dependencies for mobile software-renderer tests
        if: matrix.arch == 'x64' && needs.inputs.outputs.mobile_ui_tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libfreetype-dev
      - name: Compile Android application and embedded core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android.py build --arch ${{ matrix.arch }} --gradle-offline
      - name: Retain completed Android compiler objects after later failures
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from action_cache import allow_completed_compiler_cache
          allow_completed_compiler_cache('.')
      - name: Save Android Go compilation
        if: github.ref == 'refs/heads/main' && steps.go_cache.outputs.cache-hit != 'true' && steps.go_cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: ${{ env.GOCACHE }}
          key: ${{ steps.go_cache.outputs.cache-primary-key }}
      - name: Start Android test device
        if: matrix.arch == 'x64'
        run: |
          sudo chmod a+rw /dev/kvm
          python3 scripts/android.py emulator --arch x64
      - name: Export Android compilation for candidate validation
        run: python3 scripts/android.py export --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: android_build
        with:
          name: build-android-${{ matrix.arch }}
          path: |
            dist/android-build/build.tar.gz
            dist/android-build/build.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Package and validate the Android candidate
        shell: python
        env:
          BUILD_ARTIFACT_ID: ${{ steps.android_build.outputs.artifact-id }}
          BUILD_ARTIFACT_DIGEST: ${{ steps.android_build.outputs.artifact-digest }}
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from workflow_artifacts import stage_local_build, commit
          stage_local_build(pathlib.Path('dist/android-build/build.tar.gz'), pathlib.Path('ci-build'),
              'android', '${{ matrix.arch }}', commit(),
              int(os.environ['BUILD_ARTIFACT_ID']), os.environ['BUILD_ARTIFACT_DIGEST'])
          subprocess.run([sys.executable, 'scripts/android.py', 'package', '--arch', '${{ matrix.arch }}',
              '--run-id', '${{ github.run_id }}', '--check', '--build', 'ci-build'], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-android-${{ matrix.arch }}
          path: |
            dist/*.apk
            dist/*.sha256
            dist/package-receipt.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-report-${{ matrix.arch }}
          path: |
            target/android-report
            apps/android/core/go.mod
            apps/android/core/go.sum
          if-no-files-found: warn
          retention-days: 3
  check:
    if: ${{ !inputs.refresh_dependencies }}
    name: ${{ matrix.system }}-${{ matrix.arch }}
    needs: inputs
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            python: '3.15'
          - os: windows-11-arm
            system: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            python: '3.15'
          - os: ubuntu-22.04
            system: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            python: '3.15'
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            python: '3.15'
          - os: macos-15-intel
            system: macos
            arch: x64
            python: '3.15'
            target: x86_64-apple-darwin
          - os: macos-latest
            system: macos
            arch: arm64
            python: '3.15'
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONUTF8: '1'
      COR_CI_EXTENDED_TESTS: ${{ needs.inputs.outputs.extended_tests }}
      COR_CI_LINUX_USER_TESTS: ${{ needs.inputs.outputs.linux_user_tests }}
      COR_CI_DESKTOP_UI_TESTS: ${{ needs.inputs.outputs.desktop_ui_tests }}
      COR_CI_PROXY_BENCHMARK: ${{ needs.inputs.outputs.proxy_benchmark }}
      COR_CI_UPDATE_TESTS: ${{ needs.inputs.outputs.update_tests }}
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Preserve one immutable source identity for PR builds and packaging.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Load approved tool versions
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'versions'], check=True)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && env.COR_PYTHON_WINDOWS_ARM64 || env.COR_PYTHON }}
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
      - name: Apply the resolved source dependency snapshot
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'apply'], check=True)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ env.COR_RUST }}-${{ matrix.target }}
          components: rustfmt, clippy
      - name: Identify compatible native compiler objects
        id: rust_identity
        env:
          WORKSPACE_RECEIPT_DIRECTORY: ${{ runner.temp }}/workspace-sources
        run: |
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from action_cache import workspace_restore_identity
          directory = os.environ['WORKSPACE_RECEIPT_DIRECTORY']
          identity = workspace_restore_identity('.', 'native-main-v4-${{ matrix.system }}-${{ matrix.arch }}',
              directory)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('WORKSPACE_SOURCE_CACHE=' + str(pathlib.Path(directory)/'source.json') + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('receipt_directory=' + directory + '\nprefix=' + identity['prefix'] +
                  '\nlegacy_prefix=' + identity['legacy_prefix'] + '\npaths<<CACHE_PATHS\n' +
                  '\n'.join(identity['paths']) + '\nCACHE_PATHS\n')
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        timeout-minutes: ${{ matrix.system == 'macos' && matrix.arch == 'x64' && 12 || 5 }}
        continue-on-error: true
        id: rust_github
        with:
          prefix-key: ${{ steps.rust_identity.outputs.prefix }}
          key: ${{ matrix.os == 'windows-11-arm' && format('vendor-{0}-local-deps-v1', hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/build-versions.json', 'vendor/**')) || format('workspace-{0}-local-deps-v1', hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/build-versions.json', 'apps/**', 'crates/**', 'vendor/**', 'resources/**')) }}
          cache-on-failure: false
          cache-bin: false
          # Source hashes are checked before restoring workspace mtimes; changed
          # crates are invalidated explicitly, even for an older source branch.
          cache-workspace-crates: ${{ matrix.os != 'windows-11-arm' }}
          cache-directories: ${{ steps.rust_identity.outputs.receipt_directory }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          lookup-only: true
      - name: Look up compatible native workspace objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ steps.rust_identity.outputs.paths }}
          key: ${{ steps.rust_identity.outputs.prefix }}-compatible-lookup
          restore-keys: |
            ${{ steps.rust_identity.outputs.prefix }}-
            ${{ steps.rust_identity.outputs.legacy_prefix }}-
          lookup-only: true
      - name: Restore compatible native workspace with retries
        id: rust_fallback
        uses: ./.github/actions/cache-restore-retry
        timeout-minutes: 25
        with:
          path: ${{ steps.rust_identity.outputs.paths }}
          key: ${{ steps.rust_identity.outputs.prefix }}-${{ matrix.os == 'windows-11-arm' && format('vendor-{0}-local-deps-v1', hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/build-versions.json', 'vendor/**')) || format('workspace-{0}-local-deps-v1', hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/build-versions.json', 'apps/**', 'crates/**', 'vendor/**', 'resources/**')) }}
          restore-keys: |
            ${{ steps.rust_identity.outputs.prefix }}-
            ${{ steps.rust_identity.outputs.legacy_prefix }}-
          cleanup: compiler
      - name: Verify native architecture
        run: |
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from build_support import host_arch
          assert host_arch() == '${{ matrix.arch }}'
          assert 'host: ${{ matrix.target }}' in subprocess.check_output(['rustc', '-vV'], text=True)
      - name: Prepare Ubuntu baseline download paths
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-download-cache
        timeout-minutes: 30
        continue-on-error: true
      - name: Prepare cached Ubuntu compiler environment
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-cache
        timeout-minutes: 35
      - name: Prepare frozen native resources on the host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/prepare-resources.py', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}'], check=True)
      - name: Compile, test and export native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          command = [sys.executable, 'scripts/run-ci.py', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}']
          if '${{ matrix.system }}' == 'macos':
              command = [sys.executable, 'scripts/macos_ci.py', 'ci', '--arch', '${{ matrix.arch }}']
          elif '${{ matrix.system }}' == 'linux':
              command = [sys.executable, 'scripts/linux_ci.py', 'ci']
          subprocess.run(command, check=True)
      - name: Retain completed native compiler objects after later failures
        if: ${{ !cancelled() }}
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from action_cache import allow_completed_compiler_cache
          allow_completed_compiler_cache('.')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: native_build
        with:
          name: build-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            dist/build/build.tar.gz
            dist/build/build.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Stage the uploaded native build without downloading it again
        env:
          BUILD_ARTIFACT_ID: ${{ steps.native_build.outputs.artifact-id }}
          BUILD_ARTIFACT_DIGEST: ${{ steps.native_build.outputs.artifact-digest }}
        run: |
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from workflow_artifacts import stage_local_build, commit
          stage_local_build(pathlib.Path('dist/build/build.tar.gz'), pathlib.Path('ci-build'),
              '${{ matrix.system }}', '${{ matrix.arch }}', commit(),
              int(os.environ['BUILD_ARTIFACT_ID']), os.environ['BUILD_ARTIFACT_DIGEST'])
      - name: Package and test installed native programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          if '${{ matrix.system }}' == 'linux':
              subprocess.run([sys.executable, 'scripts/linux_ci.py', 'package',
                  '--build', 'ci-build', '--ci-run-id', '${{ github.run_id }}'], check=True)
              subprocess.run([sys.executable, 'scripts/test-release-package.py',
                  '--linux-compat', '--expect-linux', 'ubuntu', '22.04',
                  '--expect-arch', '${{ matrix.arch }}'], check=True)
          else:
              subprocess.run([sys.executable, 'scripts/test-release-package.py',
                  '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}',
                  '--build', 'ci-build', '--ci-run-id', '${{ github.run_id }}'], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: linux-tun-test-${{ matrix.arch }}
          path: dist/linux-tun-test
          if-no-files-found: error
          retention-days: 3
      - name: Assemble the native RPM compatibility candidate
        if: matrix.system == 'linux'
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from linux_apt import install
          from linux_native_package import rpm_candidate
          install(['rpm', 'binutils'], timeout=300, no_recommends=True)
          rpm_candidate()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.system == 'linux'
        with:
          name: linux-rpm-${{ matrix.arch }}
          path: dist/linux-rpm
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*.deb
            dist/*.dmg
            dist/*.sha256
            dist/package-receipt.json
          if-no-files-found: error
          retention-days: 3
      - name: Recover and verify macOS networking before report uploads
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 3
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/macos_ci.py', 'network-check', '--arch', '${{ matrix.arch }}'], check=True)
      - name: Collect macOS failure diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/macos_ci.py', 'diagnostics', '--arch', '${{ matrix.arch }}'], check=True)
      - name: Preserve macOS results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'macOS'
        with:
          name: macos-ci-report-${{ matrix.arch }}
          path: target/macos-report
          if-no-files-found: error
          retention-days: 3
      - name: Preserve Windows test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'Windows' && (needs.inputs.outputs.extended_tests == 'true' || needs.inputs.outputs.update_tests == 'true')
        with:
          name: windows-ci-report-${{ matrix.arch }}
          path: |
            target/windows-ci-report.json
            target/windows-gui-report.json
            target/windows-update-report.json
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve local proxy throughput measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && needs.inputs.outputs.proxy_benchmark == 'true'
        with:
          name: proxy-benchmark-${{ matrix.system }}-${{ matrix.arch }}
          path: target/proxy-benchmark-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve Linux package diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'Linux' && hashFiles('target/linux-report/**') != ''
        with:
          name: linux-package-report-${{ matrix.arch }}
          path: target/linux-report
          if-no-files-found: warn
          retention-days: 3
  cache_budget:
    name: Actions cache budget
    needs: [inputs, android, check]
    if: ${{ !cancelled() && !inputs.refresh_dependencies }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    concurrency:
      group: actions-cache-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Report dependency upgrade and replacement candidates without applying them
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/build_inputs.py audit --directory target/dependency-audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-audit
          path: target/dependency-audit
          retention-days: 3
          if-no-files-found: error
      - name: Load the trusted main cache policy
        if: github.ref != 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: .cache-policy-main
          persist-credentials: false
      - name: Keep latest main caches and remove branch caches
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          CACHE_POLICY_SCRIPT: ${{ github.ref == 'refs/heads/main' && 'scripts/workflow_storage.py' || '.cache-policy-main/scripts/workflow_storage.py' }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import os, subprocess, sys
          command = [sys.executable, os.environ['CACHE_POLICY_SCRIPT']]
          if os.environ['CACHE_READ_ONLY'] == 'true': command.append('--read-only')
          subprocess.run(command, check=True)
