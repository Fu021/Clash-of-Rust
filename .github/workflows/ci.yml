name: Rust
on:
  push:
  pull_request:
jobs:
  check:
    name: ${{ matrix.system }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            python: '3.11'
          - os: windows-11-arm
            system: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            python: '3.13'
          - os: ubuntu-22.04
            system: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            python: '3.11'
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Never restore objects built against a different distribution's ABI.
          prefix-key: ${{ runner.os == 'Linux' && format('v0-rust-{0}', matrix.os) || 'v0-rust' }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Verify native architecture
        run: |
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from build_support import host_arch
          assert host_arch() == '${{ matrix.arch }}', 'Python host architecture mismatch'
          assert 'host: ${{ matrix.target }}' in subprocess.check_output(['rustc', '-vV'], text=True), 'Rust host architecture mismatch'
      - if: runner.os == 'Linux'
        run: |
          import subprocess
          subprocess.run(['sudo', 'apt-get', 'update'], check=True)
          subprocess.run(['sudo', 'apt-get', 'install', '-y', 'libglib2.0-dev', 'libxkbcommon-dev', 'libwayland-dev', 'libx11-dev', 'libx11-xcb-dev', 'fonts-noto-cjk', 'gsettings-desktop-schemas', 'dbus', 'dpkg-dev', 'xvfb', 'xauth', 'iproute2', 'util-linux'], check=True)
      - name: Rust checks and tests
        run: |
          import subprocess
          subprocess.run(['cargo', 'fmt', '--all', '--', '--check'], check=True)
          subprocess.run(['cargo', 'clippy', '--all-targets', '--locked', '--', '-D', 'warnings'], check=True)
          subprocess.run(['cargo', 'test', '--locked'], check=True)
      - if: runner.os == 'Linux'
        run: |
          import subprocess, os
          subprocess.run(['cargo', 'test', '--locked', '--lib', 'native_gsettings', '--', '--ignored'], check=True, env=dict(os.environ, GSETTINGS_BACKEND='memory'))
          subprocess.run(['dbus-run-session', '--', 'cargo', 'test', '--locked', '--lib', 'native_kde_signal', '--', '--ignored'], check=True)
          subprocess.run(['dbus-run-session', '--', 'cargo', 'test', '--locked', '--lib', 'no_tray_host', '--', '--ignored'], check=True)
      - name: Build package and test core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/native-detector-codegen.py', '--check'], check=True)
          subprocess.run([sys.executable, 'scripts/test-build-tools.py'], check=True)
          subprocess.run([sys.executable, 'scripts/build-installer.py', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}'], check=True)
          subprocess.run(['cargo', 'test', '--locked', '--test', 'core_integration', '--', '--ignored', '--test-threads=1'], check=True)
      - name: Windows installer tests
        if: runner.os == 'Windows'
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/test-installer.py'], check=True)
      - name: Windows native tray, icons and update helper checks
        if: runner.os == 'Windows'
        run: |
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from build_support import bundle_directory
          executable = bundle_directory('windows', '${{ matrix.arch }}') / 'clash-of-rust.exe'
          subprocess.run(['cargo', 'test', '--locked', '--test', 'tray_integration', '--', '--ignored'], check=True)
          subprocess.run([sys.executable, 'scripts/verify-icon-resources.py', str(executable)], check=True)
          subprocess.run([sys.executable, 'scripts/test-update-helper.py', str(executable)], check=True)
      - name: Windows Defender installer scan
        if: runner.os == 'Windows'
        run: |
          import subprocess, sys, glob
          installers = glob.glob('dist/*-setup.exe')
          assert len(installers) == 1, 'Expected exactly one Windows installer to scan'
          subprocess.run([sys.executable, 'scripts/scan-defender.py', '--update-signatures', *installers], check=True)
      - name: Debian package tests
        if: runner.os == 'Linux'
        run: |
          import subprocess, sys, glob
          for artifact in glob.glob('dist/*.deb'):
              subprocess.run(['sudo', sys.executable, 'scripts/test-deb.py', artifact], check=True)
      - name: Linux package GUI smoke tests
        if: runner.os == 'Linux'
        run: |
          import subprocess, sys, glob
          for artifact in glob.glob('dist/*.deb'):
              subprocess.run(['sudo', 'apt-get', 'install', '-y', './' + artifact], check=True)
              subprocess.run(['dbus-run-session', '--', 'xvfb-run', '-a', sys.executable, 'scripts/test-linux-gui.py', '--executable', '/usr/bin/clash-of-rust'], check=True)
      - name: Linux native TUN authorization and routing tests
        if: runner.os == 'Linux'
        run: |
          import subprocess, sys, json, os, shutil
          output = subprocess.check_output(['cargo', 'test', '--locked', '--test', 'linux_tun', '--no-run', '--message-format=json'], text=True)
          binaries = [entry['executable'] for line in output.splitlines() if (entry := json.loads(line)).get('reason') == 'compiler-artifact' and entry.get('executable') and entry['target']['name'] == 'linux_tun']
          assert len(binaries) == 1
          # Hosted runners make /opt writable; use normal system-directory
          # ownership so the fixed-target authorization helper can trust it.
          subprocess.run(['sudo', 'chown', 'root:root', '/opt'], check=True)
          subprocess.run(['sudo', 'chmod', '0755', '/opt'], check=True)
          subprocess.run(['stat', '-c', '%U %G %a %n', '/opt', '/opt/clash-of-rust', '/opt/clash-of-rust/resources', '/opt/clash-of-rust/clash-of-rust', '/opt/clash-of-rust/resources/mihomo', '/opt/clash-of-rust/resources/core.json'], check=True)
          subprocess.run(['sudo', sys.executable, 'scripts/test-linux-tun.py', '--test-binary', binaries[0], '--uid', str(os.getuid())], check=True)
          shutil.copyfile(binaries[0], 'target/linux-tun-test')
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        with:
          name: linux-tun-test-${{ matrix.arch }}
          if-no-files-found: error
          path: target/linux-tun-test
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.system }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*.deb
            dist/*.sha256
  ubuntu_latest:
    name: Ubuntu latest-x64 TUN and GUI
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: package-linux-x64
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: linux-tun-test-x64
          path: target
      - name: Verify Ubuntu 22.04 package on Ubuntu latest
        shell: python
        run: |
          import subprocess, sys, os, glob
          from pathlib import Path
          subprocess.run(['sudo', 'apt-get', 'update'], check=True)
          subprocess.run(['sudo', 'apt-get', 'install', '-y', 'dbus', 'xvfb', 'xauth', 'iproute2', 'util-linux'], check=True)
          packages = glob.glob('dist/*.deb')
          assert len(packages) == 1
          subprocess.run(['sudo', 'apt-get', 'install', '-y', './' + packages[0]], check=True)
          subprocess.run(['sudo', 'chown', 'root:root', '/opt'], check=True)
          subprocess.run(['sudo', 'chmod', '0755', '/opt'], check=True)
          binary = Path('target/linux-tun-test').resolve()
          binary.chmod(0o755)
          subprocess.run(['dbus-run-session', '--', 'xvfb-run', '-a', sys.executable, 'scripts/test-linux-gui.py', '--executable', '/usr/bin/clash-of-rust'], check=True)
          subprocess.run(['sudo', sys.executable, 'scripts/test-linux-tun.py', '--test-binary', str(binary), '--uid', str(os.getuid())], check=True)
