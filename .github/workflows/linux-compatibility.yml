name: Verify a Linux Compatibility Matrix
on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      run_id:
        required: true
        type: string
env:
  BUILD_INPUTS_DIR: dependency-snapshot
  PYTHONDONTWRITEBYTECODE: '1'
  COR_CI_EXTENDED_TESTS: 'false'
  COR_CI_LINUX_USER_TESTS: 'false'
permissions:
  actions: read
  contents: read
jobs:
  resolve:
    name: Resolve verified CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve the verified CI source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          SUITE: ${{ inputs.suite }}
        run: python3 scripts/compatibility.py resolve --suite "$SUITE" --run-id "$SOURCE_RUN"
  installed:
    name: ${{ matrix.distribution }} ${{ matrix.release }}-${{ matrix.arch }} installed proxy and TUN
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.qemu != '' && 120 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
          run-id: ${{ needs.resolve.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Apply frozen inputs
        run: python3 scripts/build_inputs.py apply
      - name: Identify the VM tools cache
        if: matrix.qemu != ''
        id: vm-tools
        shell: python
        env:
          RUNNER_LABEL: ${{ matrix.os }}
          QEMU_PACKAGES: ${{ matrix.qemu }}
        run: |
          import hashlib, os
          profile = hashlib.sha256(os.environ['QEMU_PACKAGES'].encode()).hexdigest()[:16]
          prefix = f"linux-host-apt-v1-{os.environ['RUNNER_LABEL']}-{profile}-"
          version = os.environ['ImageVersion']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'prefix={prefix}\nkey={prefix}{version}\n')
      - name: Restore VM tools downloads
        if: matrix.qemu != ''
        id: vm-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/cor-host-apt
          key: ${{ steps.vm-tools.outputs.key }}
          restore-keys: ${{ steps.vm-tools.outputs.prefix }}
      - name: Install virtual machine tools
        if: matrix.qemu != ''
        shell: python
        env:
          QEMU_PACKAGES: ${{ matrix.qemu }}
          COR_LINUX_APT_CACHE: ${{ runner.temp }}/cor-host-apt
        run: |
          import os, pathlib, subprocess
          import sys
          sys.path.insert(0, 'scripts')
          from linux_apt import install_vm_tools
          install_vm_tools(os.environ['QEMU_PACKAGES'].split())
          if pathlib.Path('/dev/kvm').exists():
              subprocess.run(['sudo', 'chmod', 'a+rw', '/dev/kvm'], check=True)
          else:
              print('KVM is unavailable; keeping TCG software emulation.')
      - name: Save verified VM tools downloads
        if: matrix.qemu != '' && github.ref == 'refs/heads/main' && steps.vm-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/cor-host-apt
          key: ${{ steps.vm-tools.outputs.key }}
      - name: Identify the Debian ARM64 prepared guest
        if: inputs.suite == 'debian' && matrix.release == '12' && matrix.arch == 'arm64' && github.ref == 'refs/heads/main'
        id: guest-image
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, 'scripts')
          from linux_compatibility_targets import target_for
          from linux_vm_cache import key
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"key={key(target_for('debian', '12', 'arm64'))}\n")
      - name: Restore the Debian ARM64 prepared guest
        if: steps.guest-image.outputs.key != ''
        id: guest-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/cor-prepared-debian
          key: ${{ steps.guest-image.outputs.key }}
      - name: Verify the installed CI candidate on the target distribution
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.resolve.outputs.ci_run_id }}
          SUITE: ${{ inputs.suite }}
          RELEASE: ${{ matrix.release }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          COR_LINUX_TOOLS_DIR: ${{ runner.temp }}/cor-linux-tools
          COR_LINUX_PREPARED_DISK: ${{ steps.guest-image.outputs.key != '' && format('{0}/cor-prepared-debian', runner.temp) || '' }}
        run: >
          python3 scripts/linux_ci.py verify --package-run-id "$SOURCE_RUN"
          --suite "$SUITE" --release "$RELEASE" --expect-arch "$EXPECTED_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && hashFiles('target/linux-report/**') != ''
        with:
          name: linux-package-report-${{ inputs.suite }}-${{ matrix.release }}-${{ matrix.arch }}
          path: target/linux-report
          if-no-files-found: warn
          retention-days: 3
      - name: Check space for the prepared guest cache
        if: ${{ !cancelled() && steps.verify.outputs.prepared_disk == 'true' && steps.guest-cache.outputs.cache-hit != 'true' }}
        id: guest-cache-space
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          used=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes)
          if [[ $used =~ ^[0-9]+$ ]] && (( used <= 30 * 1024 ** 3 )); then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the Debian ARM64 prepared guest
        if: ${{ !cancelled() && steps.guest-cache-space.outputs.save == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/cor-prepared-debian
          key: ${{ steps.guest-image.outputs.key }}
  record:
    name: Record compatibility
    needs: [resolve, installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Bind passing compatibility checks to the CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.resolve.outputs.ci_run_id }}
          SUITE: ${{ inputs.suite }}
        run: python3 scripts/compatibility.py record --suite "$SUITE" --run-id "$SOURCE_RUN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.suite }}-compatibility-attempt-${{ github.run_attempt }}
          path: target/compatibility
          if-no-files-found: error
          retention-days: 3
