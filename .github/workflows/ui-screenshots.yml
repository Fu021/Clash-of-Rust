name: UI Screenshots
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI number; empty selects the latest successful main CI
        type: string
      platform:
        description: Platforms to capture
        type: choice
        default: all
        options: [all, windows, linux, macos]
      architecture:
        description: Architectures to capture
        type: choice
        default: all
        options: [all, x64, arm64]
      sizes:
        description: Window sizes; both themes are always captured
        type: choice
        default: both
        options: [both, normal, compact]
  # Register the new manual workflow before it has been merged into main.
  # This event runs no screenshot jobs.
  pull_request:
    paths: ['.github/workflows/ui-screenshots.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify selected CI and freeze source
        id: source
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          PLATFORM: ${{ inputs.platform }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'scripts/ui-screenshots.py', 'resolve', '--platform', os.environ['PLATFORM'], '--architecture', os.environ['ARCHITECTURE']]
          if os.environ['CI_RUN_ID']:
              command += ['--ci-run-id', str(int(os.environ['CI_RUN_ID']))]
          subprocess.run(command, check=True)
  render:
    name: screenshots-${{ matrix.system }}-${{ matrix.arch }}
    needs: resolve
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: source
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Linux renderer dependencies
        if: runner.os == 'Linux'
        shell: python
        run: |
          import subprocess
          subprocess.run(['sudo', 'apt-get', 'update'], check=True)
          subprocess.run(['sudo', 'apt-get', 'install', '-y', 'libglib2.0-dev', 'libxkbcommon-dev', 'libwayland-dev', 'libx11-dev', 'libx11-xcb-dev', 'gsettings-desktop-schemas', 'dbus', 'xvfb', 'xauth', 'libxkbcommon-x11-0', 'libxcursor1', 'libxrandr2', 'libxi6', 'libxinerama1', 'libegl1'], check=True)
      - name: Render selected CI UI
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          command = [sys.executable, 'workflow/scripts/ui-screenshots.py', 'render', '--source', 'source', '--ci-run-id', '${{ needs.resolve.outputs.ci_run_id }}', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}', '--output', 'screenshots', '--sizes', '${{ inputs.sizes }}']
          if '${{ matrix.system }}' == 'linux':
              command = ['dbus-run-session', '--', 'xvfb-run', '-a', '--server-args=-screen 0 1800x1200x24', *command]
          subprocess.run(command, check=True)
      - name: Preserve screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshots-${{ matrix.system }}-${{ matrix.arch }}
          path: screenshots
          if-no-files-found: error
          retention-days: 14
