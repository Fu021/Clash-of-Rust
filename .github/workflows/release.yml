name: Publish Release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI 运行编号；留空则使用当前 main 提交的 CI'
        required: false
        type: string
      check_only:
        description: '只校验 CI 和安装包，不发布'
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify CI installers and publish
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CHECK_ONLY: ${{ inputs.check_only }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'scripts/publish-release.py']
          if os.environ.get('CI_RUN_ID'):
              command += ['--run-id', str(int(os.environ['CI_RUN_ID']))]
          if os.environ.get('CHECK_ONLY') == 'true':
              command.append('--check')
          subprocess.run(command, check=True)
