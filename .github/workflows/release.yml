name: Publish Release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: '成功的 CI 编号；开发分支须指定同分支的 PR CI'
        required: false
        type: string
      check_only:
        description: '完成打包和基础安装/代理测试，但不发布 Release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '显式发布预发布版；可从开发/修复分支发布，须关闭 check_only'
        required: false
        default: false
        type: boolean
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  BUILD_INPUTS_DIR: dependency-snapshot
permissions:
  actions: read
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve verified CI
    if: github.ref == 'refs/heads/main' || inputs.check_only || inputs.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      version: ${{ steps.source.outputs.version }}
      nsis: ${{ steps.tools.outputs.nsis }}
      tailscale: ${{ steps.tools.outputs.tailscale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - name: Verify CI and freeze source
        id: source
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CHECK_ONLY: ${{ inputs.check_only }}
          PRERELEASE: ${{ inputs.prerelease }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'scripts/publish-release.py', '--resolve']
          if os.environ['CHECK_ONLY'] == 'true':
              command.append('--check')
          if os.environ['PRERELEASE'] == 'true':
              command.append('--prerelease')
          if os.environ.get('CI_RUN_ID'):
              command += ['--run-id', str(int(os.environ['CI_RUN_ID']))]
          subprocess.run(command, check=True)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
          run-id: ${{ steps.source.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Reuse CI dependencies and approved packaging tools unchanged
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/build_inputs.py apply
          python3 scripts/build_inputs.py packaging
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packaging-dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
          retention-days: 3
          if-no-files-found: error
  package:
    name: package-${{ matrix.system }}-${{ matrix.arch }}
    needs: resolve
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
            arch: x64
            python: '3.15'
          - os: windows-11-arm
            system: windows
            arch: arm64
            python: '3.15'
          - os: ubuntu-22.04
            system: linux
            arch: x64
            python: '3.15'
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            python: '3.15'
          - os: macos-15-intel
            system: macos
            arch: x64
            python: '3.15'
          - os: macos-latest
            system: macos
            arch: arm64
            python: '3.15'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Load approved tool versions
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'versions'], check=True)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && env.COR_PYTHON_WINDOWS_ARM64 || env.COR_PYTHON }}
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: packaging-dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
      - name: Apply the verified CI dependency snapshot
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'apply'], check=True)
      - name: Remember original macOS DNS before cache login
        if: runner.os == 'macOS'
        id: original_dns
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/action_cache.py', 'network-save'], check=True)
      - name: Connect to private dependency cache
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        timeout-minutes: ${{ runner.os == 'macOS' && 8 || 3 }}
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.resolve.outputs.tailscale }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: ${{ runner.os != 'Windows' && '--tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082' || '' }}
      - name: Restore macOS DNS after cache login
        if: always() && runner.os == 'macOS' && steps.original_dns.outcome == 'success'
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/action_cache.py', 'network-restore'], check=True)
      - name: Preserve host routing after private cache login
        if: steps.tailnet.outcome == 'success'
        shell: python
        run: |
          import os, shutil, subprocess
          # The official action already supplies --accept-routes during login.
          command = [shutil.which('tailscale') or 'tailscale', 'set', '--accept-routes=false', '--accept-dns=false']
          if os.name != 'nt':
              command = ['sudo', '-n', *command]
          subprocess.run(command, check=True)
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - name: Fetch verified native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/workflow_artifacts.py', 'fetch', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}', '--run-id', '${{ needs.resolve.outputs.ci_run_id }}', '--output', 'ci-build'], check=True)
      - name: Cache Ubuntu baseline downloads
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-download-cache
        timeout-minutes: 30
        continue-on-error: true
      - name: Enqueue verified original downloads before package tests
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          checkpoint: 'true'
      - name: Package and test installed programs
        run: |
          import subprocess, sys
          if '${{ matrix.system }}' == 'linux':
              subprocess.run([sys.executable, 'scripts/linux_ci.py', 'package', '--build', 'ci-build', '--ci-run-id', '${{ needs.resolve.outputs.ci_run_id }}'], check=True)
              subprocess.run([sys.executable, 'scripts/test-release-package.py', '--linux-compat', '--expect-ubuntu', '22.04'], check=True)
          else:
              subprocess.run([sys.executable, 'scripts/test-release-package.py', '--system', '${{ matrix.system }}', '--arch', '${{ matrix.arch }}', '--build', 'ci-build', '--ci-run-id', '${{ needs.resolve.outputs.ci_run_id }}'], check=True)
      - name: Preserve Linux GUI diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'Linux'
        with:
          name: linux-package-report-${{ matrix.arch }}
          path: target/linux-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve Windows GUI diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'Windows'
        with:
          name: windows-package-gui-report-${{ matrix.arch }}
          path: target/windows-gui-report.json
          if-no-files-found: warn
          retention-days: 3
      - name: Collect macOS diagnostics
        if: always() && runner.os == 'macOS'
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/macos_ci.py', 'diagnostics', '--arch', '${{ matrix.arch }}'], check=True)
      - name: Preserve macOS diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'macOS'
        with:
          name: macos-package-report-${{ matrix.arch }}
          path: target/macos-report
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: linux-tun-test-${{ matrix.arch }}
          path: dist/linux-tun-test
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-${{ matrix.system }}-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*.deb
            dist/*.dmg
            dist/*.sha256
            dist/package-receipt.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  ubuntu_latest:
    name: Ubuntu latest-x64 proxy and TUN
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - name: Connect to private system package cache
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        timeout-minutes: 3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ env.COR_TAILSCALE }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Preserve host routing
        if: steps.tailnet.outcome == 'success'
        run: sudo -n tailscale set --accept-routes=false --accept-dns=false
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - name: Wait for the verified Linux package from this run
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/workflow_artifacts.py wait --system linux --arch x64 --run-id '${{ github.run_id }}'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package-linux-x64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-tun-test-x64
          path: target
      - name: Verify the same package on Ubuntu latest
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/test-release-package.py', '--linux-compat'], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-package-report-latest
          path: target/linux-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  ubuntu_20:
    name: Ubuntu 20.04-${{ matrix.arch }} installed GUI and TUN
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            qemu: qemu-system-x86
          - os: ubuntu-22.04-arm
            arch: arm64
            qemu: qemu-system-arm qemu-efi-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: packaging-dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
      - name: Connect to private Linux download cache
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        timeout-minutes: 3
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.resolve.outputs.tailscale }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Preserve host routing after private cache login
        if: steps.tailnet.outcome == 'success'
        run: sudo -n tailscale set --accept-routes=false --accept-dns=false
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - name: Prepare Ubuntu VM original downloads
        uses: ./.github/actions/linux-download-cache
        timeout-minutes: 15
        continue-on-error: true
        with:
          vm: 'true'
      - name: Install virtual machine tools
        shell: python
        env:
          QEMU_PACKAGES: ${{ matrix.qemu }}
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from linux_apt import OPTIONS, privileged, install
          os.environ['COR_LINUX_APT_CACHE'] = os.environ['COR_HOST_APT_CACHE']
          privileged([*OPTIONS, 'update'], 300)
          install([*os.environ['QEMU_PACKAGES'].split(), 'qemu-utils', 'cloud-image-utils'])
          if pathlib.Path('/dev/kvm').exists():
              subprocess.run(['sudo', 'chmod', 'a+rw', '/dev/kvm'], check=True)
          else:
              print('KVM is unavailable; keeping TCG software emulation.')
      - name: Enqueue verified VM and package originals before waiting
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          checkpoint: 'true'
      - name: Wait for the verified Linux package from this run
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/workflow_artifacts.py wait --system linux --arch '${{ matrix.arch }}' --run-id '${{ github.run_id }}'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-tun-test-${{ matrix.arch }}
          path: target
      - name: Verify the same package with the Ubuntu 20.04 GA kernel
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/linux_ci.py vm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-package-report-ubuntu20-${{ matrix.arch }}
          path: target/linux-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  android:
    name: package-android-${{ matrix.arch }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armv7, x64]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: packaging-dependency-snapshot
          path: ${{ env.BUILD_INPUTS_DIR }}
      - name: Apply the verified CI dependency snapshot
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/build_inputs.py', 'apply'], check=True)
      - name: Connect to private Android tool cache
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        timeout-minutes: 3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ env.COR_TAILSCALE }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Preserve host routing
        if: steps.tailnet.outcome == 'success'
        run: sudo -n tailscale set --accept-routes=false --accept-dns=false
      - uses: ./.github/actions/upstream-cache
        with:
          url: ${{ steps.tailnet.outcome == 'success' && vars.LOCAL_CACHE_URL || '' }}
          token: ${{ secrets.LOCAL_CACHE_TOKEN }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: ${{ env.COR_JAVA }}
      - name: Prepare Android package tools
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'scripts')
          from build_inputs import check_tools
          from android import prepare_sdk
          check_tools(('java',))
          prepare_sdk(package_only=True)
      - name: Start Android package test device
        if: matrix.arch == 'x64'
        run: |
          sudo chmod a+rw /dev/kvm
          python3 scripts/android.py emulator --arch x64
      - name: Load distribution signing key
        if: ${{ !inputs.check_only }}
        shell: python
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          import base64, os, pathlib
          if not all(os.environ.get(key) for key in ('SIGNING_KEY','KEYSTORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD')):
              raise RuntimeError('Android 正式发布须配置长期签名密钥；测试包请启用 check_only')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-distribution.p12'
          path.write_bytes(base64.b64decode(os.environ['SIGNING_KEY'],validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for key,value in {'ANDROID_KEYSTORE_PATH':str(path),'ANDROID_KEYSTORE_PASSWORD':os.environ['KEYSTORE_PASSWORD'],
                  'ANDROID_KEY_ALIAS':os.environ['KEY_ALIAS'],'ANDROID_KEY_PASSWORD':os.environ['KEY_PASSWORD']}.items():
                  if '\n' in value or '\r' in value: raise ValueError('Invalid signing value')
                  out.write(key+'='+value+'\n')
      - name: Package verified Android APK
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          import os, subprocess, sys
          command=[sys.executable,'scripts/android.py','package','--arch','${{ matrix.arch }}',
              '--run-id','${{ needs.resolve.outputs.ci_run_id }}']
          if os.environ['CHECK_ONLY']=='true': command.append('--check')
          subprocess.run(command,check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-android-${{ matrix.arch }}
          path: |
            dist/*.apk
            dist/*.sha256
            dist/package-receipt.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.arch == 'x64'
        with:
          name: android-package-test-report
          path: target/android-report
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve original download inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/upstream-report
        with:
          name: upstream-downloads-${{ github.job }}-${{ strategy.job-index || '0' }}
  publish:
    name: Publish verified release
    needs: [resolve, package, ubuntu_latest, ubuntu_20, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load approved tool versions
        run: python3 scripts/build_inputs.py versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.COR_PYTHON }}
      - name: Verify packages and publish or finish test-only run
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
          CHECK_ONLY: ${{ inputs.check_only }}
          PRERELEASE: ${{ inputs.prerelease }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'scripts/publish-release.py', '--run-id', os.environ['CI_RUN_ID'], '--package-run-id', os.environ['GITHUB_RUN_ID']]
          if os.environ['CHECK_ONLY'] == 'true':
              command.append('--check')
          if os.environ['PRERELEASE'] == 'true':
              command.append('--prerelease')
          subprocess.run(command, check=True)
  cache_budget:
    name: Actions cache budget
    needs: [resolve, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      id-token: write
    concurrency:
      group: actions-cache-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prioritize slow Rust compilation within the 9 GiB cache budget
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/workflow_storage.py
      - name: Connect for final private cache inventory
        id: tailnet
        if: vars.TS_OAUTH_CLIENT_ID != '' && vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        continue-on-error: true
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-action-cache
          version: ${{ needs.resolve.outputs.tailscale || '1.104.5' }}
          use-cache: 'false'
          retry: '1'
          timeout: 45s
          args: --accept-dns=false
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:19082
      - name: Report the cache after all successful uploads
        if: steps.tailnet.outcome == 'success'
        continue-on-error: true
        env:
          CACHE_URL: ${{ vars.LOCAL_CACHE_URL }}
          CACHE_TOKEN: ${{ secrets.LOCAL_CACHE_TOKEN }}
          CACHE_PROXY: http://127.0.0.1:19082
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sudo -n tailscale set --accept-routes=false --accept-dns=false
          python3 scripts/action_cache.py inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.tailnet.outcome == 'success'
        with:
          name: packaging-private-cache-inventory
          path: target/cache-inventory.json
          retention-days: 3
          if-no-files-found: warn
