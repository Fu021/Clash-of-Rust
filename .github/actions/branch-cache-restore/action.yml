name: Restore branch compiler changes
description: Apply a bounded, verified branch overlay to a restored main compiler cache
inputs:
  family:
    description: Platform and build-profile identity
    required: true
  source:
    description: Checkout containing the Cargo target
    default: '.'
  sources:
    description: Optional workspace source receipt directory
    default: ''
outputs:
  ready:
    description: Baseline and any restored overlay are usable
    value: ${{ steps.snapshot.outputs.ready == 'true' && (steps.restore.outputs.cache-matched-key == '' || steps.apply.outputs.applied == 'true') }}
  key:
    description: Branch overlay key for the current source revision
    value: branch-delta-v1-${{ inputs.family }}-${{ steps.snapshot.outputs.compatibility }}-${{ github.sha }}
  hit:
    description: Current source revision already has an exact overlay
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Snapshot restored main compiler objects
      id: snapshot
      shell: python
      env:
        CACHE_DELTA_SOURCE: ${{ inputs.source }}
        CACHE_DELTA_SOURCES: ${{ inputs.sources }}
      run: |
        import os, pathlib, subprocess, sys
        directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cor-branch-delta'
        command = [sys.executable, 'scripts/workflow_cache_delta.py', 'snapshot',
                   '--source', os.environ['CACHE_DELTA_SOURCE'],
                   '--state', str(directory / 'baseline.json')]
        if os.environ['CACHE_DELTA_SOURCES']:
            command += ['--sources', os.environ['CACHE_DELTA_SOURCES']]
        try:
            subprocess.run(command, check=True, timeout=180)
        except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
            print('Compiler baseline snapshot unavailable; branch overlay skipped.')
    - name: Restore branch compiler changes
      id: restore
      if: steps.snapshot.outputs.ready == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/cor-branch-delta/restored
        key: branch-delta-v1-${{ inputs.family }}-${{ steps.snapshot.outputs.compatibility }}-${{ github.sha }}
        restore-keys: branch-delta-v1-${{ inputs.family }}-${{ steps.snapshot.outputs.compatibility }}-
    - name: Verify and apply branch compiler changes
      id: apply
      if: steps.restore.outcome == 'success' && steps.restore.outputs.cache-matched-key != ''
      shell: python
      env:
        CACHE_DELTA_SOURCE: ${{ inputs.source }}
        CACHE_DELTA_SOURCES: ${{ inputs.sources }}
      run: |
        import os, pathlib, subprocess, sys
        directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cor-branch-delta'
        command = [sys.executable, 'scripts/workflow_cache_delta.py', 'apply',
                   '--source', os.environ['CACHE_DELTA_SOURCE'],
                   '--state', str(directory / 'baseline.json'),
                   '--directory', str(directory / 'restored')]
        if os.environ['CACHE_DELTA_SOURCES']:
            command += ['--sources', os.environ['CACHE_DELTA_SOURCES']]
        subprocess.run(command, check=True)
