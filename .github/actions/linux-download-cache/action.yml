name: Ubuntu 20.04 original downloads
description: Set per-run download paths and verify official archives
runs:
  using: composite
  steps:
    - name: Configure temporary Linux download paths
      shell: bash
      env:
        COR_LINUX_TOOLS_DIR: ${{ runner.temp }}/cor-linux-tools
      run: |
        echo "COR_LINUX_TOOLS_DIR=$COR_LINUX_TOOLS_DIR" >> "$GITHUB_ENV"
        echo "COR_LINUX_APT_CACHE=$RUNNER_TEMP/cor-host-apt" >> "$GITHUB_ENV"
    - name: Verify or download frozen original archives
      shell: bash
      run: timeout 900 python3 scripts/linux_ci.py cache-downloads
