name: Ubuntu 20.04 original downloads
description: Verify official archives and use the private original-file fallback on download failure
inputs:
  vm:
    description: Also download the original cloud image
    default: 'false'
runs:
  using: composite
  steps:
    - name: Configure temporary Linux download paths
      shell: bash
      env:
        COR_LINUX_TOOLS_DIR: ${{ runner.temp }}/cor-linux-tools
        CACHE_VM: ${{ inputs.vm }}
      run: |
        echo "COR_LINUX_TOOLS_DIR=$COR_LINUX_TOOLS_DIR" >> "$GITHUB_ENV"
        if [ "$CACHE_VM" = true ]; then
          echo "COR_LINUX_APT_CACHE=$COR_LINUX_TOOLS_DIR/apt" >> "$GITHUB_ENV"
        fi
    - name: Verify or download frozen original archives
      shell: bash
      env:
        CACHE_VM: ${{ inputs.vm }}
      run: |
        arguments=(cache-downloads)
        if [ "$CACHE_VM" = true ]; then arguments+=(--vm); fi
        timeout 900 python3 scripts/linux_ci.py "${arguments[@]}"
