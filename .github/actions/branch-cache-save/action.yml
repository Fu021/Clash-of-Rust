name: Save branch compiler changes
description: Save only bounded compiler changes relative to the restored main cache
inputs:
  source:
    description: Checkout containing the Cargo target
    default: '.'
  sources:
    description: Optional workspace source receipt directory
    default: ''
  key:
    description: Overlay key from the matching restore action
    required: true
runs:
  using: composite
  steps:
    - name: Collect changed compiler objects
      id: pack
      shell: python
      env:
        CACHE_DELTA_SOURCE: ${{ inputs.source }}
        CACHE_DELTA_SOURCES: ${{ inputs.sources }}
      run: |
        import os, pathlib, subprocess, sys
        directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cor-branch-delta'
        command = [sys.executable, 'scripts/workflow_cache_delta.py', 'pack',
                   '--source', os.environ['CACHE_DELTA_SOURCE'],
                   '--state', str(directory / 'baseline.json'),
                   '--directory', str(directory / 'upload')]
        if os.environ['CACHE_DELTA_SOURCES']:
            command += ['--sources', os.environ['CACHE_DELTA_SOURCES']]
        subprocess.run(command, check=True)
    - name: Save changed compiler objects
      if: steps.pack.outputs.saved == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/cor-branch-delta/upload
        key: ${{ inputs.key }}
