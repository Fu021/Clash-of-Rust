name: Runtime dependency cache
description: GitHub first, private fallback for approved tools and signed host package downloads
inputs:
  kind:
    description: bootstrap, rust, go, java, android, android-package, emulator or apt
    required: true
  url:
    description: Private cache service URL after tailnet login
    required: false
  token:
    description: Private cache access token
    required: false
  target:
    description: Additional Rust target installed in this job
    required: false
  save:
    description: Mirror successful jobs only
    default: 'true'
runs:
  using: composite
  steps:
    - name: Identify approved runtime directories
      id: plan
      shell: python
      env:
        RUNTIME_CACHE_KIND: ${{ inputs.kind }}
        RUNTIME_RUST_TARGET: ${{ inputs.target }}
      run: |
        import os, subprocess, sys
        subprocess.run([sys.executable, 'scripts/runtime_cache.py', 'plan',
                        '--kind', os.environ['RUNTIME_CACHE_KIND']], check=True)
    - name: Restore GitHub runtime dependency snapshot
      id: github
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      continue-on-error: true
      with:
        path: ${{ steps.plan.outputs.directory }}
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.prefix }}
    - name: Restore private runtime fallback and capture successful tools
      uses: ./.github/actions/local-cache
      with:
        url: ${{ inputs.url }}
        token: ${{ inputs.token }}
        group: ${{ steps.plan.outputs.group }}
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.prefix }}
        paths: ${{ steps.plan.outputs.directory }}
        github-hit: ${{ steps.github.outcome == 'success' && steps.github.outputs.cache-hit || '' }}
        github-failed: ${{ steps.github.outcome == 'failure' }}
        immutable: ${{ steps.plan.outputs.immutable }}
        save: ${{ inputs.save }}
        runtime: ${{ inputs.kind }}
