name: Original download inventory
description: Persist complete URL batches and distinguish pending imports from verified ready receipts
inputs:
  name:
    description: Unique artifact name for this matrix job
    required: false
  checkpoint:
    description: Submit early without polling or uploading the final artifact
    default: 'false'
runs:
  using: composite
  steps:
    - name: Submit verified original download URLs
      shell: python
      env:
        UPSTREAM_CHECKPOINT: ${{ inputs.checkpoint }}
      run: |
        import os, subprocess, sys
        checkpoint = os.environ['UPSTREAM_CHECKPOINT'] == 'true'
        command = [sys.executable, 'scripts/upstream_cache.py', 'submit']
        if checkpoint:
            command += ['--budget-seconds', '20', '--poll-seconds', '0', '--no-summary']
        subprocess.run(command, check=True, timeout=30 if checkpoint else 90)
        if not checkpoint:
            with open(os.environ['GITHUB_ENV'], 'a') as environment:
                environment.write('COR_UPSTREAM_REPORT_ATTEMPTED=true\n')
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ !cancelled() && inputs.checkpoint != 'true' }}
      with:
        name: ${{ inputs.name }}
        path: target/upstream-downloads.json
        retention-days: 3
        if-no-files-found: error
