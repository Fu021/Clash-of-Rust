[package]
name = "clash-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android NativeActivity and Slint host"
autotests = false

[lib]
name = "clash_mobile"
crate-type = ["cdylib"]

[features]
mobile-ui-tests = ["dep:i-slint-core", "dep:slint"]

[[test]]
name = "mobile_lists"
required-features = ["mobile-ui-tests"]

[[test]]
name = "scroll_remount"
required-features = ["mobile-ui-tests"]

[[test]]
name = "claude_report_blocks"
required-features = ["mobile-ui-tests"]

[target.'cfg(target_os = "android")'.dependencies]
clash-mobile-runtime = { path = "../../../crates/mobile-ffi" }
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-skia-opengl", "unstable-fontique-012"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tempfile.workspace = true
jni = "0.22"
log = "0.4"
android_logger = "0.15"
rustix = { version = "1.1", features = ["time"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
i-slint-core = { version = "=1.19.0", optional = true, default-features = false, features = ["std", "image-decoders", "svg"] }
slint = { version = "=1.19.0", optional = true, default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-path", "unstable-fontique-012"] }

[build-dependencies]
serde_json.workspace = true
slint-build.workspace = true

[dev-dependencies]
anyhow.workspace = true
clash-mobile-runtime = { path = "../../../crates/mobile-ffi" }
log = "0.4"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
