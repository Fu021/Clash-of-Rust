[package]
name = "clash-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android NativeActivity and Slint host"

[lib]
name = "clash_mobile"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
clash-mobile-runtime = { path = "../../../crates/mobile-ffi" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-skia-opengl"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
jni = "0.21"
log = "0.4"
android_logger = "0.15"

[build-dependencies]
slint-build.workspace = true
