[package]
name = "clash-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless and scriptable Clash of Rust command-line client"

[[bin]]
name = "cor"
path = "src/main.rs"

[dependencies]
clash-client-core = { path = "../../crates/client-core" }
clash-client-runtime = { path = "../../crates/client-runtime" }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
uuid.workspace = true
unicode-width = "0.2"

[dev-dependencies]
tempfile.workspace = true
