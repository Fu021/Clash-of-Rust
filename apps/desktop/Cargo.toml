[package]
name = "clash-of-rust"
version.workspace = true
edition.workspace = true
default-run = "clash-of-rust"
description = "A native Rust desktop client for mihomo"
license.workspace = true

[features]
# Screenshot harness; never enabled for official application builds.
ui-preview = []

[[test]]
name = "ui_preview"
path = "tests/ui_preview.rs"
harness = false
required-features = ["ui-preview"]

[[bin]]
name = "clash-tun-launcher"
path = "src/tun_launcher.rs"

[dependencies]
clash-client-core = { path = "../../crates/client-core" }
anyhow = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
iced = { workspace = true }
iced_graphics = { workspace = true }
cosmic-text = { workspace = true }
unicode-script = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tempfile = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
tray-icon = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_TaskScheduler", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Reuse tray-icon's D-Bus library for the desktop portal's native file chooser.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
# Reuse the bindings already used by tray-icon; keep AppKit on the GUI thread.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSStatusItem", "NSStatusBarButton", "NSImage", "NSWindow", "NSOpenPanel", "NSPanel", "NSSavePanel", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSThread", "NSString", "NSURL", "NSArray"] }

[build-dependencies]
semver = "1"

