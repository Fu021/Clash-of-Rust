<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Clash of Rust：基于 Rust、Slint 与 mihomo 的原生代理客户端。管理订阅、节点与规则，按应用分流，并用网络工具箱排查连接。">
  <meta name="theme-color" content="#232321">
  <title>{{title}}</title>
  <link rel="icon" type="image/png" href="assets/app.png">
  <link rel="stylesheet" href="assets/site.css">
  <script type="module" src="assets/site.js"></script>
</head>
<body data-page="{{page}}">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Clash of Rust 首页">
        <img src="assets/wordmark.svg" width="176" height="29" alt="Clash of Rust">
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="index.html" {{nav_home}}>首页</a>
        <a href="features.html" {{nav_features}}>功能</a>
        <a href="download.html" {{nav_download}}>下载</a>
      </nav>
      <a class="repository-link" href="https://github.com/Fu021/Clash-of-Rust" target="_blank" rel="noopener noreferrer" aria-label="打开 GitHub 仓库">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#code"></use></svg>
        <span>GitHub</span>
        <svg class="icon small" aria-hidden="true"><use href="assets/icons.svg#external"></use></svg>
      </a>
    </div>
  </header>
  <main id="main">{{content}}</main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <a class="brand" href="index.html"><img src="assets/wordmark.svg" width="160" height="26" alt="Clash of Rust"></a>
        <p>原生界面，清晰连接。</p>
      </div>
      <nav aria-label="页脚导航">
        <a href="features.html">功能介绍</a>
        <a href="download.html">下载安装</a>
        <a href="https://github.com/Fu021/Clash-of-Rust/tree/main/docs" target="_blank" rel="noopener noreferrer">使用文档 ↗</a>
        <a href="https://github.com/Fu021/Clash-of-Rust" target="_blank" rel="noopener noreferrer">开源仓库 ↗</a>
      </nav>
    </div>
    <div class="footer-bottom"><span>Rust · Slint · mihomo</span><a href="assets/LICENSE.txt">GPL-3.0-only</a><span>图中界面使用演示数据。</span></div>
  </footer>
  <dialog class="image-dialog" aria-label="界面预览">
    <div class="image-dialog-bar"><span data-image-title>界面预览</span><button class="icon-button" data-close-image aria-label="关闭预览"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#close"></use></svg></button></div>
    <img data-full-image alt="">
    <p><a data-original-image target="_blank" rel="noopener noreferrer">查看原图 ↗</a></p>
  </dialog>
</body>
</html>
