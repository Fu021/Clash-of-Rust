<section class="app-demo" data-demo>
  <h3>From the home screen to every rule.</h3>
  <div class="demo-controls">
    <div class="switch" role="group" aria-label="Interface tour">
      <button type="button" data-demo-step="0" aria-pressed="true" aria-controls="app-demo-view">Home</button>
      <button type="button" data-demo-step="1" aria-pressed="false" aria-controls="app-demo-view">Nodes</button>
      <button type="button" data-demo-step="2" aria-pressed="false" aria-controls="app-demo-view">Rules</button>
      <button type="button" data-demo-step="3" aria-pressed="false" aria-controls="app-demo-view">Diagnostics</button>
      <button type="button" data-demo-step="4" aria-pressed="false" aria-controls="app-demo-view">Protection</button>
      <button type="button" data-demo-step="5" aria-pressed="false" aria-controls="app-demo-view">App routing</button>
    </div>
    <button type="button" class="btn ghost" data-demo-play aria-pressed="false">Play tour</button>
  </div>
  <div class="demo-view" id="app-demo-view">
    <div data-demo-frame="0">{{shot:home}}</div>
    <div data-demo-frame="1" hidden>{{shot:nodes}}</div>
    <div data-demo-frame="2" hidden>{{shot:rules}}</div>
    <div data-demo-frame="3" hidden>{{shot:network}}</div>
    <div data-demo-frame="4" hidden>{{shot:protection}}</div>
    <div data-demo-frame="5" hidden>{{shot:applications}}</div>
  </div>
  <p data-demo-status aria-live="polite" class="demo-status"></p>
</section>
