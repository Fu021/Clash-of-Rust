[package]
name = "clash-desktop-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clash-client-runtime = { path = "../client-runtime" }
anyhow.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde_json.workspace = true
reqwest.workspace = true
uuid.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
tray-icon = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_TaskScheduler", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_WinRT", "UI_Notifications", "Data_Xml_Dom"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Services", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Reuse tray-icon's D-Bus library for the desktop portal's native file chooser.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Share Slint's muda 0.19: two versions register incompatible MudaMenuItem
# Objective-C classes and can overwrite native menu objects during startup.
tray-icon = { version = "=0.24.2", default-features = false }
block2 = "0.6"
# Reuse the bindings already used by tray-icon; keep AppKit on the GUI thread.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSStatusItem", "NSStatusBarButton", "NSImage", "NSWindow", "NSView", "NSScreen", "NSOpenPanel", "NSPanel", "NSSavePanel", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSThread", "NSString", "NSURL", "NSArray", "NSBundle"] }

objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "block2"] }

